<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project Liftoff: Neo-Colombo 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,400;0,500;0,600;0,700;1,600&family=Monoton&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#F4EAFB; --bg2:#E8D9F5; --panel:#FFFFFF; --card:#FFFFFF; --ink:#1C1035; --muted:#5E4D7E;
  --pink:#C0137A; --cyan:#007E86; --gold:#9A6A00; --money:#1B7F3A; --red:#B3122E;
  --line:rgba(28,16,53,.14); --glow:none; --glow-c:none; --shadow:0 10px 26px rgba(40,10,80,.14);
  --btn:#C0137A; --btn-ink:#FFFFFF; --stamp:#C0137A;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#120A2A; --bg2:#1C1140; --panel:#1A1038; --card:#1E1344; --ink:#F2EAFF; --muted:#AE9DD6;
    --pink:#FF3EA5; --cyan:#2DE2E6; --gold:#FFD23F; --money:#7CFF8A; --red:#FF4D6A;
    --line:rgba(242,234,255,.13); --glow:0 0 12px rgba(255,62,165,.55); --glow-c:0 0 14px rgba(45,226,230,.5);
    --shadow:0 16px 40px rgba(0,0,0,.5); --btn:#FF3EA5; --btn-ink:#160B30; --stamp:#FF3EA5;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#120A2A; --bg2:#1C1140; --panel:#1A1038; --card:#1E1344; --ink:#F2EAFF; --muted:#AE9DD6;
  --pink:#FF3EA5; --cyan:#2DE2E6; --gold:#FFD23F; --money:#7CFF8A; --red:#FF4D6A;
  --line:rgba(242,234,255,.13); --glow:0 0 12px rgba(255,62,165,.55); --glow-c:0 0 14px rgba(45,226,230,.5);
  --shadow:0 16px 40px rgba(0,0,0,.5); --btn:#FF3EA5; --btn-ink:#160B30; --stamp:#FF3EA5;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Chakra Petch",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:18px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg2)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:18px 18px 64px}
.wrap.wide{max-width:1320px}
.neon{font-family:"Monoton","Chakra Petch",sans-serif;font-weight:400;color:var(--pink);text-shadow:var(--glow);letter-spacing:.02em;line-height:1.1;margin:0}
h1.neon{font-size:clamp(1.9rem,5.2vw,3.6rem)}
.sub{font-size:.9rem;color:var(--muted);margin:14px 0 2px}
.muted{color:var(--muted)}.small{font-size:.86rem}
.ok{color:var(--money);font-weight:700}.bad{color:var(--red);font-weight:700}
h2.h{font-size:1.15rem;font-weight:700;margin:26px 0 10px;color:var(--cyan)}

/* ---------- HUD ---------- */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg2);border-bottom:1px solid var(--line)}
.hud-in{max-width:1120px;margin:0 auto;padding:8px 18px;display:grid;grid-template-columns:1.1fr 1.1fr 1.3fr 1fr 1.3fr;gap:14px;align-items:center}
.hk{font-size:.72rem;color:var(--muted)}
.hv{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hs{font-size:.74rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hs.warn{color:var(--red);font-weight:700}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--cyan);box-shadow:var(--glow-c)}
.bar.health i{background:var(--pink);box-shadow:var(--glow)}
.money{font-size:1.45rem;font-weight:700;color:var(--money);text-align:right;line-height:1.1}
.stars{color:var(--gold);letter-spacing:.12em;text-align:right;font-size:1.05rem}
.stars .off{opacity:.25}
@media (max-width:820px){.hud-in{grid-template-columns:repeat(3,minmax(0,1fr))}.money,.stars{text-align:left}}

/* ---------- Art + comic captions ---------- */
.art{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:21/8;min-height:220px;background:#1a0b3d;box-shadow:var(--shadow);margin-top:10px}
.art svg,.art img.art-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.art::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 3px);pointer-events:none}
.caps{display:flex;gap:12px;flex-wrap:wrap;margin:-26px 14px 6px;position:relative;z-index:3}
.cap{flex:1 1 200px;background:#FFD23F;color:#14092B;border:3px solid #14092B;box-shadow:5px 5px 0 #14092B;padding:8px 12px;font-weight:700;font-size:1.02rem;line-height:1.3}
.cap.c0{transform:rotate(-1.2deg)}.cap.c1{background:#fff;transform:rotate(.8deg)}.cap.c2{transform:rotate(-.6deg)}
.badge{position:absolute;top:12px;right:14px;z-index:2;background:rgba(10,4,30,.75);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:4px 12px;font-size:.8rem}
@media (max-width:720px){.art{aspect-ratio:16/9;min-height:0}.caps{margin:10px 0}}
.ctrl{position:sticky;bottom:0;z-index:6;margin-top:18px;padding-bottom:env(safe-area-inset-bottom,0px)}
.ctrl-in{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;background:var(--bg2);border:1px solid var(--pink);box-shadow:var(--glow);border-radius:14px;padding:12px 16px}
.sel{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px;margin:0 6px}
.crew.au{border-color:var(--red)}
.hstage .art{aspect-ratio:auto;height:clamp(170px,30vh,360px);min-height:0}
.hstage h1.neon{font-size:clamp(1.8rem,4vw,3rem)}
.hstage .huge{font-size:clamp(2.6rem,7vw,5rem)}
/* ---------- News ticker ---------- */
.ticker{display:flex;align-items:stretch;background:#0A0520;color:#fff;border-radius:0 0 12px 12px;overflow:hidden;font-size:.95rem}
.ticker b{background:#E8152E;padding:8px 12px;white-space:nowrap;flex:none}
.ticker .run{overflow:hidden;flex:1;position:relative;padding:8px 0}
.ticker .run span{display:inline-block;white-space:nowrap;padding-left:100%;animation:tick 18s linear infinite}
@keyframes tick{to{transform:translateX(-100%)}}

/* ---------- Layout ---------- */
.mission{display:grid;grid-template-columns:330px minmax(0,1fr);gap:22px;align-items:start;margin-top:18px}
@media (max-width:900px){.mission{grid-template-columns:1fr}}

/* ---------- Phone (crew chat) ---------- */
.phone{background:#0E0826;color:#EDE6FF;border-radius:30px;padding:12px;border:2px solid #2A1C55;box-shadow:var(--shadow)}
.phone .top{display:flex;justify-content:space-between;font-size:.75rem;color:#9F8FD0;padding:2px 10px 8px}
.phone .title{font-weight:700;padding:0 10px 8px;border-bottom:1px solid rgba(255,255,255,.08)}
.msgs{display:grid;gap:10px;padding:10px 4px 4px}
.msg{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:start;animation:pop .35s ease both}
.msg .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#24164F;font-size:1.1rem}
.msg .nm{font-size:.74rem;color:#2DE2E6}
.msg .nm span{color:#9F8FD0}
.msg .bb{background:#24164F;border-radius:4px 14px 14px 14px;padding:7px 10px;font-size:.92rem;line-height:1.35}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- Mission cards ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.cc{position:relative;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-height:215px;transition:transform .15s ease,border-color .15s ease}
.cc:hover{transform:translateY(-3px)}
.cc[aria-pressed="true"]{border-color:var(--cyan);box-shadow:var(--glow-c),var(--shadow);transform:translateY(-5px)}
.cc[disabled]{cursor:not-allowed;opacity:.5;transform:none}
.cc.lockedv{opacity:.82;cursor:default}
.cc.lockedv:hover{transform:none}
.cc .lt{position:absolute;top:10px;right:14px;font-family:"Monoton",sans-serif;font-size:1.6rem;color:var(--pink);text-shadow:var(--glow)}
.cc .sig{font-size:2rem;line-height:1}
.cc h3{font-size:1.12rem;line-height:1.2;margin:2px 0 0;padding-right:28px}
.cc .fl{margin:0;color:var(--muted);font-size:.9rem}
.cc ul{margin:auto 0 0;padding:8px 0 0;list-style:none;border-top:1px dashed var(--line);font-size:.82rem}
.cc li{padding:1px 0}
.cc .lockr{font-size:.82rem;color:var(--red);font-weight:700}
.stamp{position:absolute;right:12px;bottom:12px;border:3px solid var(--stamp);color:var(--stamp);padding:4px 10px;border-radius:8px;font-weight:700;font-size:1.05rem;transform:rotate(-10deg);background:var(--card);box-shadow:var(--glow);animation:stamp .5s cubic-bezier(.2,1.6,.4,1) both;z-index:2}
@keyframes stamp{from{transform:scale(2.4) rotate(-25deg);opacity:0}to{transform:scale(1) rotate(-10deg);opacity:1}}

/* ---------- Status strip ---------- */
.strip{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:14px 0}
.cd{font-family:"Monoton",sans-serif;font-size:2rem;color:var(--cyan);text-shadow:var(--glow-c);min-width:3.2em}
.cd.hot{color:var(--red)}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:.8rem;font-weight:700;border:1px solid currentColor}

/* ---------- Picker ---------- */
.picker{background:var(--panel);border:1px dashed var(--pink);border-radius:12px;padding:12px;margin:12px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}

/* ---------- Buttons ---------- */
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:10px;padding:12px 20px;font-weight:700;cursor:pointer;background:var(--btn);color:var(--btn-ink);font-size:1rem;box-shadow:var(--glow)}
.btn[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.danger{background:transparent;color:var(--red);border:1px solid var(--red);box-shadow:none}
.btn.big{padding:15px 26px;font-size:1.08rem}
.btn.cyan{background:var(--cyan);box-shadow:var(--glow-c)}

/* ---------- Panels / planning ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:20px;align-items:start}
@media (max-width:880px){.grid2{grid-template-columns:1fr}}
.sticky{position:sticky;top:calc(env(safe-area-inset-top,0px) + 86px)}
.feat{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.fc{text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.fc[aria-pressed="true"]{border-color:var(--cyan);box-shadow:var(--glow-c)}
.fc[aria-pressed="false"]{opacity:.65}
.fc .top{display:flex;justify-content:space-between;gap:8px}
.fc b{font-size:.98rem}
.fc .pts{font-weight:700;white-space:nowrap;color:var(--pink)}
.fc p{margin:0;font-size:.82rem;color:var(--muted)}
.fc .meta{font-size:.76rem;color:var(--muted)}
.tag{display:inline-block;font-size:.7rem;font-weight:700;border-radius:6px;padding:1px 6px;background:var(--pink);color:var(--btn-ink)}
.tests{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:600px){.tests{grid-template-columns:1fr}}
.range{width:100%;accent-color:var(--pink)}
.bign{font-family:"Monoton",sans-serif;font-size:2.8rem;line-height:1;color:var(--cyan);text-shadow:var(--glow-c)}
.fl-row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.fl-row:last-child{border-bottom:0}
fieldset[disabled] .fc,fieldset[disabled] .range{pointer-events:none}
fieldset{border:0;margin:0;padding:0;min-width:0}

/* ---------- Dice ---------- */
.dice{display:flex;gap:18px;align-items:center;margin:16px 0}
.d20{width:92px;height:92px;flex:none;position:relative}
.d20 svg{width:100%;height:100%}
.d20 .n{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:2rem;color:#fff}
.d20.rolling svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Outcome / ending ---------- */
.banner-x{font-family:"Monoton",sans-serif;font-size:clamp(1.6rem,4.6vw,3rem);color:var(--gold);text-shadow:0 0 14px rgba(255,210,63,.45);margin:18px 0 6px;line-height:1.1}
.story{font-size:1.12rem;max-width:66ch}
.report{display:grid;gap:8px;margin:12px 0}
.rep{border-left:4px solid var(--cyan);padding:8px 12px;background:var(--panel);border-radius:0 10px 10px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}
.st{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;animation:pop .5s ease both}
.st .k{font-size:.8rem;color:var(--muted)}
.st .v{font-size:1.4rem;font-weight:700}
.log{list-style:none;padding:0;margin:0}
.log li{padding:8px 0;border-bottom:1px solid var(--line)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--panel);border:1px solid var(--line);padding:6px 10px;border-radius:8px;display:inline-block;font-size:.85rem}
.center{text-align:center}
.big-emoji{font-size:4rem;line-height:1}

/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;background:rgba(6,2,20,.7);display:grid;place-items:center;z-index:20;padding:20px}
.modal .box{background:var(--panel);color:var(--ink);border:2px solid var(--pink);box-shadow:var(--glow),0 20px 60px rgba(0,0,0,.5);border-radius:16px;max-width:460px;width:100%;padding:22px}
.modal h3{margin:0 0 8px;font-size:1.4rem}

.banner{background:rgba(255,210,63,.12);border:1px solid var(--gold);border-radius:10px;padding:10px 14px;font-size:.9rem;margin:12px 0}

/* ---------- Host ---------- */
.board{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table.tb{border-collapse:collapse;width:100%;min-width:720px;font-size:.88rem}
.tb th,.tb td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tb th{background:var(--bg2);font-weight:700}
.tb tr.cur td{background:rgba(45,226,230,.09)}
.c-lock{color:var(--money);font-weight:700}.c-wait{color:var(--gold)}.c-none{color:var(--muted)}
.count{font-family:"Monoton",sans-serif;font-size:2.4rem;line-height:1;color:var(--cyan);text-shadow:var(--glow-c)}
.read{font-size:1.25rem;line-height:1.35;margin:6px 0 10px;font-weight:600}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.steps span{padding:4px 10px;border-radius:999px;border:1px solid var(--line);font-size:.8rem;color:var(--muted)}
.steps span.on{border-color:var(--pink);color:var(--pink);font-weight:700;box-shadow:var(--glow)}
.qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.qr{background:#fff;color:#111;border-radius:12px;padding:14px;text-align:center}
.qr .q{display:grid;place-items:center;min-height:200px}
.qr a{color:#333;word-break:break-all;font-size:.7rem}
.field{display:grid;gap:4px;margin-bottom:12px}
.field input,.field select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}

/* ---------- Big screen ---------- */
.screen{min-height:100vh;display:flex;flex-direction:column;padding:18px 26px}
.screen .art{aspect-ratio:auto;height:44vh}
.crews{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:16px}
.crew{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px 14px;min-height:90px}
.crew.lk{border-color:var(--money)}
.crew .cn{font-weight:700;font-size:1.05rem}
.crew .cs{font-size:.95rem;margin-top:4px}
.huge{font-family:"Monoton",sans-serif;font-size:clamp(3rem,10vw,7rem);color:var(--cyan);text-shadow:var(--glow-c);line-height:1}


/* ===== v3: cleaner crew screens ===== */
.hud-in{grid-template-columns:repeat(4,minmax(0,1fr)) auto}
@media (max-width:820px){.hud-in{grid-template-columns:repeat(2,minmax(0,1fr))}}
.hid{font-size:.72rem;color:var(--muted);border:1px dashed var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
.art{aspect-ratio:auto;height:clamp(190px,36vh,420px)}
@media (max-width:720px){.art{height:auto;aspect-ratio:16/9}}
.hcap{position:absolute;left:16px;bottom:16px;z-index:3;max-width:min(80%,640px);background:#FFD23F;color:#14092B;border:3px solid #14092B;box-shadow:6px 6px 0 #14092B;padding:8px 14px;font-weight:700;font-size:clamp(1.05rem,2.4vw,1.6rem);line-height:1.2;transform:rotate(-1deg)}
.sit{font-size:1.15rem;max-width:62ch;margin:14px 0 4px}
.voices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:16px 0}
@media (max-width:760px){.voices{grid-template-columns:1fr}}
.voice{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--cyan);border-radius:12px;padding:10px 14px}
.voice:nth-child(2){border-left-color:var(--pink)}.voice:nth-child(3){border-left-color:var(--gold)}
.voice .vr{font-size:.8rem;color:var(--muted);font-weight:700}
.voice .vt{font-size:1.02rem;margin-top:2px}
.cards{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.cc{min-height:150px;gap:8px}
.cc h3{font-size:1.2rem}
.cc .tl{margin-top:auto;font-size:.92rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.lockbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:16px 0}
.status{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:4;display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 16px;margin:12px 0}
.status .cd{font-size:1.8rem}
/* Deal */
.fchips{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.fchip{display:flex;gap:10px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer;color:var(--ink)}
.fchip[aria-pressed="true"]{border-color:var(--cyan);box-shadow:var(--glow-c)}
.fchip[aria-pressed="false"]{opacity:.6}
.fchip .ic{font-size:1.4rem}
.fchip .nm{font-weight:700;font-size:.98rem;line-height:1.2}
.fchip .ds{font-size:.78rem;color:var(--muted)}
.fchip .pt{margin-left:auto;font-weight:700;color:var(--pink);white-space:nowrap}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1 1 120px;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;text-align:center}
.seg button[aria-pressed="true"]{border-color:var(--cyan);box-shadow:var(--glow-c)}
.seg small{display:block;color:var(--muted);font-size:.76rem}
.fit{display:flex;gap:18px;flex-wrap:wrap;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px 16px;margin-top:16px}
.fit.good{border-color:var(--money)}.fit.bad{border-color:var(--red)}
.fit .big{font-size:1.3rem;font-weight:700}
.lbl{font-weight:700;color:var(--cyan);margin:18px 0 8px;font-size:1rem}
/* Outcome */
.deltas{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.delta{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;font-weight:700}
.delta.up{color:var(--money);border-color:var(--money)}.delta.down{color:var(--red);border-color:var(--red)}
.odds{font-size:1.5rem;font-weight:700;color:var(--gold)}
/* Roles */
.roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin:16px 0}
.role{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px 14px}
.role.opt{border-style:dashed}
.role .ri{font-size:1.6rem}
.role b{display:block;font-size:1.05rem}
.role span{font-size:.88rem;color:var(--muted)}
/* Host poll */
.poll{display:grid;gap:14px;margin-top:16px}
.pcol{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.pcol .ph{display:flex;gap:10px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:8px}
.pcol .pl{font-family:"Monoton",sans-serif;font-size:2rem;color:var(--pink);text-shadow:var(--glow);line-height:1}
.pcol .pt{font-weight:700;font-size:1rem;line-height:1.2}
.pcol .pn{margin-left:auto;font-size:1.6rem;font-weight:700;color:var(--cyan)}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{display:inline-block;max-width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hstage.compact .art{height:clamp(110px,16vh,190px)}
.hstage.compact .ticker{display:none}
.hstage.compact h1.neon{font-size:clamp(1.5rem,3vw,2.2rem)}
.hstage.compact .banner-x{font-size:clamp(1.3rem,3vw,2rem)}
.pchip.auto{color:var(--red);border-color:var(--red)}
.crews{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.crew{min-height:0;padding:10px 12px}
.crew .cs{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb td{max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lead{display:grid;gap:8px;margin-top:14px}
.lrow{display:grid;grid-template-columns:48px minmax(0,1.2fr) minmax(0,1.6fr) 110px 110px 90px;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.lrow .rk{font-family:"Monoton",sans-serif;font-size:1.4rem;color:var(--gold)}

/* ===== Crew screen mirror ===== */
body.mirror button,body.mirror input,body.mirror select,body.mirror summary{pointer-events:none}
.viewseg{display:flex;gap:6px;flex-wrap:nowrap}
.viewseg button{flex:none;padding:8px 14px;font-weight:700}
.pvbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0 6px}
.pvchips{display:flex;gap:6px;flex-wrap:wrap;flex:1 1 auto}
.pvframe{border:2px solid var(--pink);box-shadow:var(--glow);border-radius:16px;overflow:hidden;background:var(--bg)}
.pvframe iframe{display:block;width:100%;height:calc(100vh - 290px);min-height:440px;border:0;background:var(--bg)}
body.mirror .wrap{padding-top:6px}
body.mirror .status{top:0}
.pvframe.phone{width:410px;max-width:100%;margin:0 auto;border:10px solid #0b061c;border-radius:38px}
.pvframe.phone iframe{height:min(800px,calc(100vh - 290px))}
/* ===== Slides ===== */
.deckbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:14px 0 4px}
.deckbar .small{flex:1 1 auto}
.slide{min-height:calc(100vh - 330px);display:flex;flex-direction:column;justify-content:center;gap:18px;padding:16px 0}
.slide h1.neon{font-size:clamp(2rem,4.4vw,3.3rem)}
.slide .art{height:clamp(150px,26vh,300px)}
.slead{font-size:clamp(1.2rem,2.1vw,1.55rem);max-width:60ch;margin:0}
.quote{font-size:clamp(1.5rem,3.2vw,2.5rem);font-weight:700;line-height:1.2;max-width:30ch;margin:0;color:var(--gold)}
.slide .art.short{height:clamp(100px,15vh,170px)}
.quote.small-q{font-size:clamp(1.3rem,2.4vw,1.9rem);max-width:none}
.sfoot{font-size:1.1rem;color:var(--muted);margin:0;max-width:70ch}
.schips{display:flex;gap:10px;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.tiles.flow{grid-template-columns:repeat(4,minmax(0,1fr))}
.tiles.six{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tiles.five{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
@media (max-width:820px){.tiles.flow{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.tile .ti{font-size:2rem;line-height:1}
.tile b{display:block;font-size:1.2rem;margin:8px 0 4px}
.tile span{color:var(--muted);font-size:1rem}
.cols2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:center}
@media (max-width:820px){.cols2{grid-template-columns:1fr}}
.trifig svg{width:100%;height:auto;max-height:46vh;color:var(--ink);overflow:visible}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}
.vh{font-weight:700;font-size:1.25rem;color:var(--cyan)}.vh.real{color:var(--pink)}
.vc{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--cyan);border-radius:10px;padding:10px 14px;font-size:1.1rem}
.vc.real{border-left-color:var(--pink)}
.sbars{display:grid;gap:10px;max-width:900px}
.sbar{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 80px;gap:14px;align-items:center;font-size:1.1rem}
.sbar .bar{height:14px;margin:0}.sbar b{text-align:right}
#print-area{display:none}
@media print{body>*:not(#print-area){display:none!important}#print-area{display:block;color:#000;background:#fff;font:12pt/1.45 Georgia,serif;padding:0}#print-area h1{font-size:20pt}#print-area h2{font-size:15pt;margin-top:18pt}#print-area h3{font-size:12.5pt;margin:14pt 0 4pt;break-after:avoid}#print-area li{margin:3pt 0}body{background:#fff}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.ticker .run span{padding-left:0}}
</style>

<body>

<main id="app" class="wrap"></main>
<div id="modal"></div>
<script>
/* ======================= ENGINE START ======================= */
var BUDGET = 12, RATE = 0.1;
var PERIODS = ['Jan–Feb 2027','Mar–Apr 2027','May–Jun 2027','Jul–Aug 2027','Sep–Oct 2027','Nov–Dec 2027'];
var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

var FEATURES = [
  {id:'flight', name:'Flight control', pts:30, val:0, risk:'High', must:true, sigil:'🛩️', desc:'Keeps the car stable in the air.'},
  {id:'safety', name:'Emergency landing', pts:20, val:0, risk:'Medium', must:true, sigil:'🪂', desc:'Lands safely if anything fails.'},
  {id:'ota', name:'Over-the-air updates', pts:12, val:2, risk:'Medium', sigil:'📡', desc:'Fix every car remotely. Boring. Maybe vital.'},
  {id:'autopilot', name:'Autopilot', pts:28, val:5, risk:'High', sigil:'🧭', desc:'The feature buyers saw in the demo.'},
  {id:'app', name:'Owner app', pts:14, val:4, risk:'Low', sigil:'📱', desc:'Unlock and summon from a phone.'},
  {id:'nav', name:'3D sky navigation', pts:16, val:3, risk:'Medium', sigil:'🗺️', desc:'Routes and no-fly zones in 3D.'},
  {id:'telemetry', name:'Fleet data dashboard', pts:10, val:2, risk:'Low', sigil:'📊', desc:'Every car reports its data back.'},
  {id:'launch', name:'Launch mode', pts:8, val:4, risk:'Low', sigil:'🚀', desc:'0–100 in a second. Pure hype.'}
];
var HOVER = {id:'hover', name:'60-second hover mode', pts:12, val:4, risk:'High', sigil:'🌀', desc:'The CEO’s new idea, added mid-project.'};
var ALLF = FEATURES.concat([HOVER]);
var VALUE_MAX = ALLF.reduce(function(a,f){return a+f.val;},0);
var CORE_PTS = 50;

var TEST = {
  minimal:{f:1.0, q0:55, dq:-6, ds:-3, label:'Minimal', sigil:'⚡', desc:'Test only what breaks. Fastest on paper.'},
  standard:{f:0.85, q0:68, dq:-1, ds:0, label:'Standard', sigil:'⚖️', desc:'Unit and integration tests on every feature.'},
  thorough:{f:0.7, q0:82, dq:2, ds:2, label:'Thorough', sigil:'🛡️', desc:'Automated suites, security reviews, flight simulations.'}
};

function oddsPct(mod,dc){var c=0;for(var r=1;r<=20;r++){if(r===20||(r!==1&&r+mod>=dc))c++;}return c*5;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function fById(id){for(var i=0;i<ALLF.length;i++){if(ALLF[i].id===id)return ALLF[i];}return null;}
function scopePts(ids){return ids.reduce(function(a,id){var f=fById(id);return a+(f?f.pts:0);},0);}
function sizeFactor(n){return n<=16?1:Math.max(0.6,1-(n-16)*0.015);}
function moraleFactor(M){return M>=60?1:(M>=40?0.9:0.75);}
function baseCap(s){return s.n*sizeFactor(s.n)*TEST[s.test].f*moraleFactor(s.M);}
function has(s,id){return s.features.indexOf(id)>=0;}
function optionalIn(s){return s.features.filter(function(id){var f=fById(id);return f&&!f.must&&id!=='hover';});}

function hashStr(str){var h=2166136261;for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function d20(seed){var t=hashStr(seed)+0x6D2B79F5;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);t=((t^(t>>>14))>>>0)/4294967296;return 1+Math.floor(t*20);}

function newState(){
  return {v:1,name:'',phase:'title',stageDone:-1,features:[],n:0,test:'standard',S:0,done:0,doneAt:{},
    budget:BUDGET,spent:0,Q:0,Sec:0,M:70,deadline:6,phased:false,period:0,flags:{},
    mod:{delta:0,mult:1,newbies:0},picks:{},log:[],lastOutcome:null,result:null};
}
function startPlan(s,plan){
  s.features=plan.features.slice(); s.n=plan.n; s.test=plan.test; s.S=scopePts(s.features);
  s.Q=TEST[s.test].q0; s.Sec=45+(has(s,'ota')?25:0); s.M=70;
}
function dropFeatures(s,ids){
  ids.forEach(function(id){var i=s.features.indexOf(id);if(i>=0){s.features.splice(i,1);}});
  s.S=scopePts(s.features);
}
function addHover(s){if(!has(s,'hover')){s.features.push('hover');s.S=scopePts(s.features);}}

function deadlineMonths(s){return s.deadline===5?10:12;}
function forecast(s){
  var cap=baseCap(s)||0.0001, rem=Math.max(0,s.S-s.done), need=rem/cap;
  var finishM=Math.ceil((s.period+need)*2-1e-9);
  return {cap:cap,need:need,finishM:finishM,late:s.phased?finishM>12:finishM>deadlineMonths(s),
          costAtEnd:s.spent+s.n*RATE*need};
}
function monthLabel(m){if(m<=0)return 'Jan 2027';var i=(m-1)%12,y=2027+Math.floor((m-1)/12);return MONTHS[i]+' '+y;}

function runPeriod(s){
  var p=s.period+1, cap=0, idle=s.done>=s.S;
  if(!idle){
    if(s.mod.newbies){var vet=s.n-s.mod.newbies;cap=vet*sizeFactor(s.n)*TEST[s.test].f*moraleFactor(s.M)*0.85;}
    else cap=baseCap(s);
    cap=Math.max(0,cap*s.mod.mult+s.mod.delta);
    s.done=Math.min(s.S,s.done+cap);
    s.spent+=s.n*RATE;
    s.Q+=TEST[s.test].dq; s.Sec+=TEST[s.test].ds;
  }
  s.period=p; s.doneAt[p]=s.done; s.mod={delta:0,mult:1,newbies:0};
  var fc=forecast(s);
  if(!idle&&fc.late){s.M-=3;}
  s.Q=clamp(s.Q,0,100); s.Sec=clamp(s.Sec,0,100); s.M=clamp(s.M,0,100);
  return {period:p,label:PERIODS[p-1],cap:cap,done:s.done,S:s.S,idle:idle,late:fc.late,finish:monthLabel(fc.finishM)};
}

var STAGES = [
  {name:'The Deal', when:'December 2026', headline:'Win the deal',
   situation:'Volta needs all the software for its flying car by 1 January 2028. Pick your scope, your team size and how much you test.',
   news:'Volta Aeromotive promises a flying car by January 2028. Your crew writes every line of its code.',
   say:'Every crew gets the same budget and deadline. Nobody can build everything. Watch who promises the most.',
   lesson:'Estimates are promises made with the least information you’ll ever have.',
   voices:[{r:'am',t:'The client wants everything. Autopilot and the app sell cars.'},{r:'pm',t:'Promise only what we can deliver. Leave room for surprises.'},{r:'qa',t:'Less testing looks fast now. The bugs wait for launch day.'}]},
  {name:'Ghosted', when:'January 2027', headline:'Your star engineer just quit',
   situation:'Ishara leaves in two weeks for a rival startup. She’s the only one who knows the flight-control code.',
   news:'Star engineer quits Volta for a rival air-taxi startup. She leaves in two weeks.',
   say:'A key person leaving mid-project.',
   lesson:'People aren’t interchangeable. Knowledge walks out the door with them.',
   voices:[{r:'dev',t:'Nobody else understands the flight code. We need a replacement.'},{r:'pm',t:'A new hire costs money and seven weeks. Can we cover the gap?'},{r:'qa',t:'Rushed handovers are where bugs are born.'}]},
  {name:'The Boss Wants Hover', when:'March 2027', headline:'The CEO wants hover. Now.',
   situation:'A demo video went viral. The CEO adds 60-second hover mode: 12 more points of work, same deadline.',
   news:'Volta CEO promises 60-second hover mode at launch. Twelve more points of work, same deadline.',
   say:'A senior stakeholder changing scope mid-project.',
   lesson:'Scope creep rarely arrives as a formal change request. It arrives as an excited executive. Data is your best negotiating tool.',
   voices:[{r:'am',t:'The CEO is thrilled. Saying no will cost us goodwill.'},{r:'ba',t:'Hover is exciting. Is it worth more than what we’d drop?'},{r:'pm',t:'If our plan is already full, show him the numbers.'}]},
  {name:'Dead Link', when:'May 2027', headline:'The vendor let you down',
   situation:'The thruster supplier’s software arrived a month late, and its documentation is wrong.',
   news:'Thruster supplier misses its delivery. Engineers report the documentation is wrong.',
   say:'A third-party dependency that let you down.',
   lesson:'Dependencies you don’t control are risks you still own. Workarounds create technical debt.',
   voices:[{r:'arch',t:'I can build a workaround. It’ll work… until it doesn’t.'},{r:'sec',t:'A workaround on the thrusters is a security risk.'},{r:'pm',t:'Waiting costs time. Paying the vendor costs money. Pick one.'}]},
  {name:'The Squeeze', when:'July 2027', headline:'Deadline cut by two months',
   situation:'The investor wants the car at an air show. New deadline: 1 November 2027, or the next $1.5M goes elsewhere.',
   news:'Investor demands Volta launch two months early: new deadline 1 November 2027.',
   say:'A deadline pulled forward by someone above you.',
   lesson:'Brooks’s law: adding people to a late project makes it later. Early design choices create options later.',
   voices:[{r:'pm',t:'Adding people to a late project usually makes it later.'},{r:'devops',t:'If we built over-the-air updates, we can ship the rest later.'},{r:'am',t:'The investor has options. Saying no has a price.'}]},
  {name:'Zero-Day', when:'September 2027', headline:'A critical security flaw',
   situation:'A security test took control of the test car’s flight system. Launch is only weeks away.',
   news:'Unconfirmed reports of a serious security flaw in Volta’s flying car.',
   say:'A serious defect or security issue found late.',
   lesson:'Security isn’t a feature you bolt on at the end. Honest disclosure protects trust.',
   voices:[{r:'sec',t:'I won’t sign off on launch with this open.'},{r:'am',t:'Regulators always find out. Better they hear it from us.'},{r:'devops',t:'Without over-the-air updates, a later fix means recalling every car.'}]},
  {name:'Burnout City', when:'October 2027', headline:'The team is burning out',
   situation:'Three weekends of overtime in a row. Two engineers ask for a week off.',
   news:'Inside Volta: staff describe punishing hours ahead of launch.',
   say:'Burnout or a crunch you lived through.',
   lesson:'Crunch buys short-term speed with long-term quality and people.',
   voices:[{r:'dev',t:'One more weekend like this and people will quit.'},{r:'pm',t:'The deadline is real. Can we cut something small instead?'},{r:'qa',t:'Tired people skip checks. That’s when quality drops.'}]},
  {name:'Launch Night', when:'Launch', headline:'Launch night',
   situation:'The cameras are live. One roll decides the demo.',
   news:'Live from the Skyline launch in Neo-Colombo. Every crew rolls for its live demo.',
   say:'Explain the odds: “You can’t control luck. You can control your odds.” Let crews roll one at a time for drama.',
   lesson:'Quality and security debt get collected on launch day.', voices:[]}
];
var BOSS_PICK = {1:'B',2:'A',3:'B',4:'A',5:'B',6:'B'};
var TL = {
  1:{A:'⏱ Slower now, 💰 +$0.2M',B:'💰 Saves money, no delay announced',C:'📦 Cut a feature, 💰 saves money'},
  2:{A:'📦 +12 points, same deadline',B:'📦 +12 points, cut 10+ points',C:'🎲 A gamble: a full plan improves your odds'},
  3:{A:'⏱ Much slower for two months',B:'⏱ Full speed, no extra cost',C:'💰 +$0.6M, full speed'},
  4:{A:'💰 +$0.8M every two months, deadline 1 Nov',B:'📦 Cut features, deadline 1 Nov',C:'⏱ Core by 1 Nov, the rest by update. Needs over-the-air updates',D:'⏱ Keep 1 Jan, 💰 lose $1.5M of budget'},
  5:{A:'⏱ Slower for two months',B:'⏱ No delay, fix it after launch',C:'⏱ Slower, 💰 +$0.3M audit'},
  6:{A:'⏱ A little slower, 🙂 rested team',B:'⏱ Faster for two months',C:'📦 Cut a feature, 🙂 rested team'}
};
var CHOICES = {
  1:[
    {id:'A',sigil:'📜',title:'Recruit a replacement',flavor:'Post the job. Pay a headhunter. Wait for the right person.',fx:['+$0.2M headhunter fee','Slower this period while you hire and onboard'],
     apply:function(s){s.spent+=0.2;s.mod.delta-=3;return 'The headhunter finds someone good, in seven weeks. The team carries the gap until then.';}},
    {id:'B',sigil:'⚖️',title:'Spread her work around',flavor:'No new hire. Everyone takes a piece.',fx:['Team shrinks by one, saving money','No delay announced'],
     apply:function(s){s.n-=1;s.M-=15;s.Q-=5;return 'The plan holds on paper. In the corridors, people are working late, and nobody quite owns the flight core.';}},
    {id:'C',sigil:'✂️',title:'Cut a feature',flavor:'Shrink the promise to match the team.',fx:['Team shrinks by one','You choose a feature to cut'],drop:{min:1},
     req:function(s){return optionalIn(s).length?null:'No optional features left to cut.';},
     apply:function(s,c){s.n-=1;dropFeatures(s,c.drop);return 'You cut scope early, while it’s still cheap. The CEO hasn’t noticed. Yet.';}}
  ],
  2:[
    {id:'A',sigil:'🤝',title:'Accept it',flavor:'The CEO is the CEO. Add hover, keep the date.',fx:['+12 points of scope','Same deadline, same team'],
     apply:function(s){addHover(s);s.M-=5;return 'Hover joins the plan. The team nods in the meeting and groans in the chat.';}},
    {id:'B',sigil:'🔄',title:'Trade it',flavor:'Add hover, but drop something of equal size.',fx:['+12 points of hover','Cut at least 10 points of other features'],drop:{minPts:10},
     req:function(s){return optionalIn(s).length?null:'No optional features left to trade.';},
     apply:function(s,c){addHover(s);dropFeatures(s,c.drop);return 'The CEO grumbles but accepts the trade. Scope stays honest.';}},
    {id:'C',sigil:'🎲',title:'Push back with data',flavor:'Show him the plan. A persuasion check: your data sets the odds.',fx:['Roll a d20','A full plan gives you a bonus'],
     apply:function(s,c){
       var fc=baseCap(s)*(6-s.period), load=(s.S-s.done)/Math.max(1,fc), mod=load>=0.85?5:-3;
       var r=d20(c.seed), ok=r===20||(r!==1&&r+mod>=12);
       c.roll={r:r,mod:mod,dc:12,ok:ok,label:'Persuasion check'};
       if(ok){s.flags.v2=true;s.M+=10;return 'Your numbers land. “Fine. Hover goes in version two.” The team sees you protect them, and morale rises.';}
       addHover(s);s.M-=10;return 'He isn’t convinced. “You clearly have room.” Hover goes in anyway, and you’ve spent credibility getting there.';}}
  ],
  3:[
    {id:'A',sigil:'⏳',title:'Wait for the vendor',flavor:'Do it properly. Lose the time.',fx:['Much slower this period','No extra cost'],
     apply:function(s){s.mod.mult*=0.6;s.M-=5;return 'Six weeks of waiting. The team works on what it can and watches the calendar.';}},
    {id:'B',sigil:'🩹',title:'Build a workaround',flavor:'Fake the interface and keep moving.',fx:['Full speed this period','No extra cost'],
     apply:function(s){s.Q-=10;s.Sec-=10;s.flags.workaround=true;return 'The workaround works. Nobody is quite sure why. Your Lookout quietly writes something down.';}},
    {id:'C',sigil:'💰',title:'Pay the vendor extra',flavor:'Money talks. The vendor puts its best people on it.',fx:['+$0.6M to the vendor','Full speed this period'],
     apply:function(s){s.spent+=0.6;return 'The vendor’s senior team fixes the API in days. Expensive, and clean.';}}
  ],
  4:[
    {id:'A',sigil:'👥',title:'Add eight engineers',flavor:'More hands, more speed. Surely.',fx:['+8 engineers, +$0.8M per period','Deadline becomes 1 Nov 2027'],
     apply:function(s){s.n+=8;s.mod.newbies=8;s.M-=5;s.deadline=5;return 'Eight new faces arrive. For the next two months, your best people spend their days explaining the codebase.';}},
    {id:'B',sigil:'✂️',title:'Cut scope to fit',flavor:'Same team, smaller promise.',fx:['Choose features to cut','Deadline becomes 1 Nov 2027'],drop:{min:1},
     req:function(s){return optionalIn(s).length?null:'No optional features left to cut.';},
     apply:function(s,c){dropFeatures(s,c.drop);s.deadline=5;return 'You redraw the plan around the new date. Some buyers will be disappointed; the car will fly.';}},
    {id:'C',sigil:'🛰️',title:'Phased launch',flavor:'Core car flies on 1 November. Everything else arrives by over-the-air update by 1 January.',fx:['Core must be ready by 1 Nov','Rest by 1 Jan 2028'],

function computeOutcome(s){

  if(s.done<s.S){var per=(s.S-s.done)/cap;monthsLate=Math.max(1,Math.ceil(per*2-1e-9));extra=s.n*RATE*per;}
  if(s.phased){var d5=s.doneAt[5]||0;if(d5<CORE_PTS){monthsLate=Math.max(monthsLate,Math.max(1,Math.ceil((CORE_PTS-d5)/cap*2-1e-9)));}}

  var value=s.features.reduce(function(a,id){var f=fById(id);return a+(f?f.val:0);},0);
  return {onTime:monthsLate===0,monthsLate:monthsLate,cost:cost,budget:s.budget,over:over,value:value,valueMax:VALUE_MAX,
    Q:Math.round(s.Q),Sec:Math.round(s.Sec),M:Math.round(s.M)};
}
function launchRoll(s,seed){

  var r=d20(seed), ok=r===20||(r!==1&&r+mod>=10);
  var why='';
  if(!ok){why=s.Sec<s.Q?'Live on air, a researcher in the crowd takes control of the demo car from her phone. The car lands itself, slowly, on a hot-dog stand.':'Forty seconds into the flight, the stabiliser glitches. The Skyline drops a metre onto the stage. Every camera catches it.';}
  else{why=r>=18?'A flawless flight. The crowd is silent, then loud. Pre-orders double overnight.':'The Skyline lifts, hovers, lands. Not perfect, but nothing breaks. Relief all round.';}
  return {r:r,mod:mod,dc:10,ok:ok,label:'Launch demo',text:why};
}

function pickEnding(s,o,roll){
  if(o.M<30)return 'death';
  if(!roll.ok&&o.Q>=60&&o.Sec>=60)return 'stumble';
  if(!roll.ok&&o.onTime)return 'fire';
  if(!roll.ok)return 'crash';
  if(o.over>20)return 'blowout';
  if(!o.onTime)return 'late';
  if(s.phased)return 'phased';
  if(o.over<=5&&o.Q>=60&&o.Sec>=60&&o.M>=50)return 'textbook';

  var sc=t+c+v+15*o.Q/100+10*o.Sec/100+10*o.M/100-(roll.ok?0:(o.Q>=60&&o.Sec>=60?4:10));

}
function finalize(s,seed){

/* Server clock: write a server timestamp, read it back, keep the sample with the shortest round trip */
function clockSample(){
  var t0=Date.now();
  return dbPut('clock/'+APP.cid,{'.sv':'timestamp'}).then(function(v){
    var t1=Date.now();
    if(typeof v==='number')return {rtt:t1-t0,off:v-(t0+t1)/2};
    return dbGet('clock/'+APP.cid).then(function(v2){var t2=Date.now();return typeof v2==='number'?{rtt:t2-t0,off:v2-(t0+t2)/2}:null;});
  }).catch(function(){return null;});
}
function syncClock(){
  var best=null;
  function one(){return clockSample().then(function(x){if(x&&(!best||x.rtt<best.rtt))best=x;});}
  return one().then(one).then(one).then(function(){if(best){APP.offset=best.off;APP.clockOk=true;}dbDel('clock/'+APP.cid).catch(function(){});});
}
function serverNow(){return Date.now()+APP.offset;}

  var t='';for(var i=1;i<=8;i++)t+='<a class="btn ghost" href="#team'+i+'" data-act="goto" data-to="team'+i+'">Crew '+i+'</a>';
  $app.innerHTML=artHtml('hero','One flying car. One deadline.')+'<h1 class="neon" style="margin-top:20px">Project Liftoff</h1><p class="sit">A software project simulation. Every decision is final.</p><div class="lbl">Join as a crew</div><div class="row">'+t+'</div><div class="lbl">Run the game</div><div class="row"><a class="btn" href="#host" data-act="goto" data-to="host">Game Master console</a></div>';
}

/* ---------- Team screens ---------- */
function syncBanner(){return APP.syncMsg==='fail'?'<div class="banner">No live link to the Game Master. You’re playing offline.</div>':'';}
function renderTeam(){var s=APP.s;renderHud();if(s.phase==='title')return renderTitle();if(s.phase==='party')return renderRoles();if(s.phase==='outcome')return renderOutcome();if(s.phase==='end')return renderEnd();return renderPlay();}
function renderTitle(){
  $app.innerHTML=syncBanner()+artHtml('hero','Crew '+APP.team+': welcome to Volta')+'<h1 class="neon" style="margin-top:20px">Project Liftoff</h1>'+
   '<p class="sit">You’re the software team building a flying car. $12M, one year, and every decision is final.</p>'+
   '<div class="panel" style="max-width:520px;margin-top:14px"><div class="field"><label for="tn"><b>Name your crew</b></label><input id="tn" maxlength="24" placeholder="Crew '+APP.team+'" value="'+esc(APP.s.name)+'"></div><button class="btn big" data-act="begin">Join</button></div>';
}
function renderRoles(){
  var c=ROLES.map(function(r){return '<div class="role'+(r.opt?' opt':'')+'"><div class="ri">'+r.icon+'</div><b>'+esc(r.title)+'</b><span>'+esc(r.job)+'</span>'+(r.opt?'<div class="small" style="margin-top:6px;color:var(--gold)">Only if you have a '+r.opt+'. Otherwise the '+esc(roleOf(r.cover).title)+' covers it.</div>':'')+'</div>';}).join('');
  $app.innerHTML='<h1 class="neon">Pick your roles</h1><p class="sit">Give each person one role. When a role speaks on screen, that person reads it aloud. The Project Manager makes the final call.</p><div class="roles">'+c+'</div><button class="btn big" data-act="party-ready">Roles assigned</button>';
}
function voicesHtml(stage){var v=STAGES[stage].voices||[];if(!v.length)return '';
  return '<div class="voices">'+v.map(function(x){var r=roleOf(x.r);return '<div class="voice"><div class="vr">'+r.icon+' '+esc(roleReader(x.r))+'</div><div class="vt">“'+esc(x.t)+'”</div></div>';}).join('')+'</div>';}
function statusHtml(mode){
  if(APP.mirror==='sample'){var P=APP.control.phase;
    if(P==='closed')return '<div class="status"><span class="pill" style="color:var(--red)">Voting closed</span><span>Choices are locked. The CEO decides for any crew that didn’t lock in.</span></div>';
    if(P==='reveal')return '<div class="status"><span class="pill" style="color:var(--gold)">Reveal</span><span>Each crew now sees what its choice did.</span></div>';}
  if(mode==='brief')return '<div class="status"><span class="pill" style="color:var(--gold)">Briefing</span><span>Read it aloud. <b>Voting opens soon.</b></span></div>';
  if(!APP.sync)return '';
  var rem=voteRemaining();
  return '<div class="status"><span class="pill" style="color:var(--money)">Voting open</span><span class="cd'+(rem<=15?' hot':'')+'" id="cd">'+fmtSecs(rem)+'</span><span>Pick one and lock it in.</span></div>';
}
function renderPlay(){
  var s=APP.s,next=s.stageDone+1;
  if(next>7){s.phase='end';return renderTeam();}
  if(!APP.sync){if(s.pending){resolveStage(next,false);return;}return renderMission(next,'open');}
  var K=APP.control.stage,P=APP.control.phase;
  if(K<next)return standby(next);
  if(K>next||P==='reveal'){resolveStage(next,!(s.pending&&s.pending.stage===next));return;}
  if(P==='brief')return renderMission(next,'brief');
  if(s.pending&&s.pending.stage===next)return lockedScreen(next);
  if(P==='closed'||voteRemaining()<=0)return timeUpScreen(next);
  return renderMission(next,'open');
}
function renderMission(stage,mode){if(stage===0)return renderDeal(mode);if(stage===7)return renderLaunch(mode);return renderScene(stage,mode);}
function standby(next){$app.innerHTML=syncBanner()+artHtml(next,'Stand by…',missionLabel(next))+'<p class="sit center" style="margin:20px auto">The Game Master opens the next mission.</p>';}
function lockedScreen(stage){
  var s=APP.s,extra='';
  if(stage===7){var o=finalize(s,seed(7));extra=diceHtml(o.roll,'pd');}
  $app.innerHTML=syncBanner()+artHtml(stage,'🔒 Locked in',missionLabel(stage))+'<div class="center" style="margin-top:18px"><p class="sit" style="margin:0 auto"><b>'+esc(s.picks[String(stage)]||'')+'</b></p>'+extra+'<p class="muted">Waiting for the reveal.</p></div>';
}
function timeUpScreen(stage){$app.innerHTML=syncBanner()+artHtml(stage,'⏰ Time’s up',missionLabel(stage))+'<p class="sit center" style="margin:20px auto">You didn’t lock in. <b>The CEO is deciding for you.</b></p>';}

/* Deal */
function defaultPlan(){return {kind:'plan',features:FEATURES.filter(function(f){return f.must;}).map(function(f){return f.id;}),n:18,test:'standard'};}
function planForecast(sel){var S=scopePts(sel.features),cap=sel.n*sizeFactor(sel.n)*TEST[sel.test].f,need=S/cap,fm=Math.ceil(need*2-1e-9),cost=sel.n*RATE*Math.min(need,99);
  return {S:S,cap:cap,fm:fm,cost:cost,late:fm>12,lateBy:Math.max(0,fm-12),over:cost>BUDGET};}
function renderDeal(mode){
  if(!APP.sel||APP.sel.kind!=='plan')APP.sel=defaultPlan();
  var sel=APP.sel,lock=mode==='brief';
  function chip(f){var on=sel.features.indexOf(f.id)>=0;return '<button class="fchip" aria-pressed="'+on+'" data-act="feat" data-id="'+f.id+'"'+(lock?' disabled':'')+'><span class="ic">'+f.sigil+'</span><span><span class="nm">'+esc(f.name)+'</span><br><span class="ds">'+esc(f.desc)+'</span></span><span class="pt">'+f.pts+'</span></button>';}
  var req=FEATURES.filter(function(f){return f.must;}).map(chip).join(''),opt=FEATURES.filter(function(f){return !f.must;}).map(chip).join('');
  var tests=Object.keys(TEST).map(function(k){var t=TEST[k];return '<button data-act="test" data-id="'+k+'" aria-pressed="'+(sel.test===k)+'"'+(lock?' disabled':'')+'><b>'+t.sigil+' '+t.label+'</b><small>'+Math.round(t.f*100)+'% build speed</small></button>';}).join('');
  $app.innerHTML=syncBanner()+statusHtml(mode)+artHtml(0,STAGES[0].headline,'Mission 0')+'<p class="sit">'+esc(STAGES[0].situation)+'</p>'+voicesHtml(0)+
   '<div class="lbl">1. Scope (points of work)</div><div class="small muted" style="margin-bottom:6px">Required</div><div class="fchips">'+req+'</div><div class="small muted" style="margin:10px 0 6px">Optional: tap to add</div><div class="fchips">'+opt+'</div>'+
   '<div class="lbl">2. Team size: <span id="nval">'+sel.n+'</span> engineers</div><input class="range" type="range" min="10" max="30" value="'+sel.n+'" id="nrange" aria-label="Team size"'+(lock?' disabled':'')+'><div class="small muted">Each engineer costs $0.1M every two months. Bigger teams coordinate more and add less per person.</div>'+
   '<div class="lbl">3. Testing</div><div class="seg">'+tests+'</div><div id="fit"></div>'+
   (lock?'':'<div class="lockbar"><button class="btn big" data-act="seal-plan">Lock in the Deal</button><span class="small muted">This can’t be changed.</span></div>');
  APP.dealLock=lock;renderFit();
}
function renderFit(){var el=document.getElementById('fit');if(!el)return;var f=planForecast(APP.sel),good=!f.late&&!f.over;
  el.innerHTML='<div class="fit '+(good?'good':'bad')+'"><span class="big">'+(good?'✅ Fits':'❌ Doesn’t fit')+'</span><span>'+f.S+' pts, finish <b class="'+(f.late?'bad':'ok')+'">'+monthLabel(f.fm)+'</b>'+(f.late?' ('+f.lateBy+' mo late)':'')+'</span><span>Cost <b class="'+(f.over?'bad':'ok')+'">'+money(f.cost)+'</b> of $12.0M</span><span class="small muted">If nothing goes wrong.</span></div>';}

/* Scene */
function renderScene(stage,mode){
  var s=APP.s,st=STAGES[stage],list=CHOICES[stage],lock=mode==='brief';
  if(!APP.sel||APP.sel.kind!=='scene'||APP.sel.stage!==stage)APP.sel={kind:'scene',stage:stage,choice:null,drop:[]};
  var sel=APP.sel;
  var cards=list.map(function(c){var reason=c.req?c.req(s):null,on=sel.choice===c.id;
    return '<button class="cc'+(lock?' lockedv':'')+'" aria-pressed="'+on+'" data-act="pick" data-id="'+c.id+'"'+(reason?' disabled':'')+(lock?' aria-disabled="true"':'')+'><span class="lt">'+c.id+'</span><div class="sig">'+c.sigil+'</div><h3>'+esc(c.title)+'</h3>'+(reason?'<p class="lockr">'+esc(reason)+'</p>':'')+'<div class="tl">'+esc(TL[stage][c.id])+'</div></button>';}).join('');
  var ch=list.filter(function(c){return c.id===sel.choice;})[0],picker='';
  if(ch&&ch.drop&&!lock){picker='<div class="picker"><b>✂️ '+(ch.drop.minPts?'Pick features worth at least '+ch.drop.minPts+' points to cut':'Pick a feature to cut')+'</b> <span class="small muted">(selected '+scopePts(sel.drop)+' pts)</span><div class="chips">'+optionalIn(s).map(function(id){var f=fById(id);return '<button class="chip" aria-pressed="'+(sel.drop.indexOf(id)>=0)+'" data-act="drop" data-id="'+id+'">'+f.sigil+' '+esc(f.name)+' ('+f.pts+')</button>';}).join('')+'</div></div>';}
  $app.innerHTML=syncBanner()+statusHtml(mode)+artHtml(stage,st.headline,missionLabel(stage)+', '+st.when)+'<p class="sit">'+esc(st.situation)+'</p>'+voicesHtml(stage)+
   '<div class="cards">'+cards+'</div>'+picker+(lock?'':'<div class="lockbar"><button class="btn big" data-act="seal-scene"'+(sealReady()?'':' disabled')+'>Lock it in</button><span class="small muted">This can’t be changed.</span></div>');
}
function sealReady(){var sel=APP.sel;if(!sel||!sel.choice)return false;var ch=CHOICES[sel.stage].filter(function(c){return c.id===sel.choice;})[0];if(!ch||!ch.drop)return true;if(ch.drop.minPts)return scopePts(sel.drop)>=ch.drop.minPts;return sel.drop.length>=1;}

/* Launch */
function renderLaunch(mode){
  if(APP.mirror==='sample'){$app.innerHTML=statusHtml(mode)+artHtml(7,STAGES[7].headline,'Final mission')+
   '<p class="sit">Every crew’s demo goes live tonight. Each crew sees its own odds, set by its hidden quality and security.</p>'+
   '<div class="dice"><div class="d20">'+d20Svg()+'<div class="n">?</div></div><div><div class="small muted">Chance of a smooth demo</div><div class="odds">Different for every crew</div></div>'+(mode==='brief'?'':'<button class="btn big">Roll for the demo</button>')+'</div>';return;}
  var s=APP.s,o=computeOutcome(s),pre=launchRoll(s,seed(7)),pct=oddsPct(pre.mod,pre.dc);
  $app.innerHTML=syncBanner()+statusHtml(mode)+artHtml(7,STAGES[7].headline,'Final mission')+
   '<p class="sit">'+(o.onTime?'Your software is ready.':'You’re '+o.monthsLate+' month'+(o.monthsLate>1?'s':'')+' behind, but the demo goes ahead.')+' Your hidden quality and security decide your odds.</p>'+
   '<div class="dice"><div class="d20" id="ld">'+d20Svg()+'<div class="n">?</div></div><div><div class="small muted">Chance of a smooth demo</div><div class="odds">'+pct+'%</div></div>'+(mode==='brief'?'':'<button class="btn big" data-act="roll-launch">Roll for the demo</button>')+'</div>';
}

/* Outcome */
function snapshot(s){return {S:s.S,left:s.budget-s.spent,M:s.M,late:s.stageDone>=0&&s.S?lateMonths(s):0,n:s.n,done:s.done};}
function deltaChips(a,b){var out=[];
  if(b.S!==a.S)out.push([b.S>a.S?'down':'up','📦 Scope '+(b.S>a.S?'+':'')+(b.S-a.S)+' pts']);
  var dm=Math.round((b.left-a.left)*10)/10;if(Math.abs(dm)>=0.05)out.push(['','💰 '+money(Math.abs(dm))+(dm<0?' spent':' back')]);
  if(Math.abs(b.M-a.M)>=3)out.push([b.M<a.M?'down':'up','🙂 Mood '+(b.M<a.M?'↓':'↑')]);
  if(b.n!==a.n)out.push(['', '👥 Team '+a.n+' → '+b.n]);
  if(b.late!==a.late)out.push([b.late>a.late?'down':'up','⏱ '+(b.late?b.late+' mo late':'Back on track')]);
  out.push(['','🔨 Built '+Math.round(b.done-a.done)+' pts']);
  return out.map(function(x){return '<span class="delta '+x[0]+'">'+esc(x[1])+'</span>';}).join('');}
function renderOutcome(){
  var s=APP.s,o=s.lastOutcome;if(!o){s.phase='play';return renderTeam();}
  $app.innerHTML=artHtml(o.stage,o.title,missionLabel(o.stage))+(o.auto?'<div class="banner" style="margin-top:14px">⏰ You didn’t lock in. <b>The CEO chose for you</b>, and the team’s mood dropped.</div>':'')+
   (o.roll?diceHtml(o.roll,'od'):'')+'<p class="sit">'+esc(o.text)+'</p>'+(o.deltas?'<div class="deltas">'+o.deltas+'</div>':'')+
   (APP.sync?'<div class="status"><span class="pill" style="color:var(--gold)">Stand by</span><span>The Game Master moves everyone on together.</span></div>':'<button class="btn big" data-act="continue" style="margin-top:10px">Continue</button>');
  if(o.roll&&!o.rollShown){o.rollShown=true;LS.set(teamKey(),JSON.stringify(s));animateDice('od',o.roll.r);}
}

/* End */
function renderEnd(){
  var s=APP.s,o=s.result,e=ENDINGS[o.ending];
  function st(k,v,g){return '<div class="st"><div class="k">'+k+'</div><div class="v '+(g?'ok':'bad')+'">'+esc(v)+'</div></div>';}
  $app.innerHTML=artHtml(7,e.sigil+' '+e.title,s.name)+diceHtml(o.roll,'ed')+'<p class="sit">'+esc(o.roll.text)+'</p>'+
   '<div class="stats">'+st('⏱ Time',o.onTime?'On time':o.monthsLate+' mo late',o.onTime)+st('💰 Cost',money(o.cost)+' of '+money(o.budget),o.over<=0)+st('📦 Customer value',o.value+' / '+o.valueMax,o.value>=o.valueMax/2)+
   st('🧪 Quality',o.Q+' / 100',o.Q>=60)+st('🛡️ Security',o.Sec+' / 100',o.Sec>=60)+st('🙂 Mood',o.M+' / 100',o.M>=50)+st('🏅 Project health',o.score+' / 100',o.score>=60)+'</div>'+
   '<div class="panel"><b>In the real world</b><p style="margin:6px 0 0">'+esc(e.real)+'</p></div>'+
   '<details style="margin-top:14px"><summary><b>Your decisions</b></summary><ul class="log">'+s.log.map(function(l){return '<li><b>'+esc(l.stage)+':</b> '+esc(l.pick)+'</li>';}).join('')+'</ul></details>';
}

/* ---------- Team actions ---------- */
function seed(stage){return APP.session+'|team'+APP.team+'|'+stage;}
function planLabel(p){return p.n+' people, '+TEST[p.test].label+' testing, '+scopePts(p.features)+' pts';}
function pickLabel(ch,drop){return ch.id+': '+ch.title+(drop&&drop.length?' (cut '+drop.map(function(id){return fById(id).name;}).join(', ')+')':'');}
function lockStage(stage,payload){
  var s=APP.s;s.letters=s.letters||{};
  if(stage===0)s.picks['0']=planLabel(payload.plan);
  else if(stage<7){var ch=CHOICES[stage].filter(function(c){return c.id===payload.choice;})[0];s.picks[String(stage)]=pickLabel(ch,payload.drop);s.letters[String(stage)]=ch.id;}
  else s.picks['7']='Rolled for the demo';
  s.pending=Object.assign({stage:stage},payload);APP.sel=null;saveTeam();
  if(!APP.sync){resolveStage(stage,false);return;}
  renderTeam();window.scrollTo(0,0);
}
function resolveStage(stage,auto){
  var s=APP.s,p=(s.pending&&s.pending.stage===stage)?s.pending:null;s.auto=s.auto||{};s.letters=s.letters||{};
  var before=snapshot(s);
  if(stage===0){
    var plan=p?p.plan:(APP.sel&&APP.sel.kind==='plan'?APP.sel:defaultPlan());
    startPlan(s,plan);if(auto){s.M-=10;s.auto['0']=true;}
    s.picks['0']=(auto?'CEO chose: ':'')+planLabel(plan);
    s.log.push({stage:'The Deal',pick:s.picks['0']+': '+plan.features.map(function(id){return fById(id).name;}).join(', ')});
    s.lastOutcome={stage:0,title:'The Deal is done',auto:auto,text:'The CEO tells the press: flying-car software by 1 January 2028. Your plan says '+monthLabel(Math.ceil(s.S/baseCap(s)*2-1e-9))+'. Let’s see.',deltas:''};
  } else if(stage===7){
    var o=finalize(s,seed(7));s.result=o;s.picks['7']=(auto?'CEO rolled: ':'')+(o.roll.ok?'Demo worked':'Demo failed')+' ('+oddsPct(o.roll.mod,o.roll.dc)+'% odds)';
    s.log.push({stage:'Launch Night',pick:s.picks['7']});s.stageDone=7;s.pending=null;s.phase='end';saveTeam();renderTeam();window.scrollTo(0,0);return;
  } else {
    var cid=p?p.choice:BOSS_PICK[stage],ch=CHOICES[stage].filter(function(c){return c.id===cid;})[0];
    var ctx={drop:p&&p.drop?p.drop.slice():[],seed:seed(stage),roll:null};
    var res=applyChoice(s,stage,ch,ctx);
    if(auto){s.M=clamp(s.M-10,0,100);s.auto[String(stage)]=true;}
    s.letters[String(stage)]=ch.id;
    s.picks[String(stage)]=(auto?'CEO chose ':'')+pickLabel(ch,ctx.drop)+(res.roll?(res.roll.ok?' (it worked)':' (it failed)'):'');
    s.log.push({stage:STAGES[stage].name,pick:s.picks[String(stage)]});
    s.stageDone=stage;
    s.lastOutcome={stage:stage,title:ch.title,auto:auto,text:res.text,roll:res.roll,deltas:deltaChips(before,snapshot(s))};
  }
  s.stageDone=stage;s.pending=null;s.phase='outcome';saveTeam();renderTeam();window.scrollTo(0,0);
}
function sealPlan(){var sel=APP.sel,f=planForecast(sel);
  confirmModal('Lock in the Deal?','<b>'+f.S+' points</b>, <b>'+sel.n+' engineers</b>, '+TEST[sel.test].label.toLowerCase()+' testing. This can’t be changed.','Lock it in',function(){
    if(APP.sync&&APP.control.phase!=='vote'){renderTeam();return;}
    lockStage(0,{plan:{features:sel.features.slice(),n:sel.n,test:sel.test}});});}
function sealScene(){var sel=APP.sel,ch=CHOICES[sel.stage].filter(function(c){return c.id===sel.choice;})[0];
  confirmModal('Lock it in?','<b>'+ch.id+': '+esc(ch.title)+'</b>'+(sel.drop.length?', cutting '+esc(sel.drop.map(function(id){return fById(id).name;}).join(', ')):'')+'. This can’t be changed.','Lock it in',function(){
    if(APP.sync&&APP.control.phase!=='vote'){renderTeam();return;}
    var btn=$app.querySelector('.cc[aria-pressed="true"]'),stage=sel.stage,payload={choice:sel.choice,drop:sel.drop.slice()};
    if(btn&&!reduceMotion()){btn.insertAdjacentHTML('beforeend','<div class="stamp">Locked in</div>');setTimeout(function(){lockStage(stage,payload);},700);}else lockStage(stage,payload);});}
function rollLaunch(){var s=APP.s,b=$app.querySelector('[data-act="roll-launch"]');if(b)b.disabled=true;var o=finalize(s,seed(7));animateDice('ld',o.roll.r);setTimeout(function(){lockStage(7,{});},reduceMotion()?0:1300);}

/* ---------- Game Master console ---------- */
function teamCount(){return APP.control.teams===8?8:6;}
function teamLink(i,base){return base+'?team='+i+'&s='+encodeURIComponent(APP.session)+(APP.db?'&db='+encodeURIComponent(APP.db):'');}
function screenLink(base){return base+'?screen=1&s='+encodeURIComponent(APP.session)+(APP.db?'&db='+encodeURIComponent(APP.db):'');}
function hostBase(){var el=document.getElementById('base');var v=el?el.value.trim():'';return v||(location.origin+location.pathname);}
function teamLocked(t,k){return !!t&&(t.stageDone>=k||t.sealed===k);}

   '<div class="row"><span id="h-pill"></span>'+(ro?'':'<div class="seg viewseg" role="group" aria-label="View"><button data-act="view" data-v="console" aria-pressed="'+(APP.view==='console')+'">🖥 Console</button><button data-act="view" data-v="crew" aria-pressed="'+(APP.view==='crew')+'">📱 Crew screen</button><button data-act="view" data-v="slides" aria-pressed="'+(APP.view==='slides')+'">🎤 Slides</button></div><button class="btn ghost" data-act="toggle-notes">Presenter notes</button><a class="btn ghost" href="#setup-sec" data-act="to-setup">Setup and links</a>')+'</div></div>'+
   '<div id="h-notes"></div><div id="h-console"'+(APP.view!=='console'&&!ro?' hidden':'')+'><div id="h-stage" class="hstage"></div><div id="h-body"></div></div>'+(ro?'':'<div id="h-crew"'+(APP.view==='crew'?'':' hidden')+'><div id="pv-bar"></div><div id="pv-frame"></div></div><div id="h-slides"'+(APP.view==='slides'?'':' hidden')+'></div>')+(ro?'':'<div class="ctrl" id="h-ctrl"></div>')+
   (ro?'':'<details id="setup-sec" class="panel" style="margin-top:28px"><summary><b>Setup, links and full history</b></summary>'+
    '<h2 class="h">Links for crews</h2><div class="field"><label for="base">Game link (where this file is hosted)</label><input id="base" value="'+esc(location.origin+location.pathname)+'"></div>'+
    '<div class="row"><button class="btn cyan" data-act="show-qr">Show crew QR codes</button><button class="btn ghost" data-act="show-links">Show links</button></div><div id="h-links" style="margin-top:14px"></div>'+
    '<h2 class="h">Facilitator script</h2><p class="small muted">Every slide note, mission, option and story cue on paper, with space for your own story notes.</p><button class="btn ghost" data-act="print-script">🖨 Print facilitator script</button>'+
    '<h2 class="h">Session</h2><div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(230px,1fr))">'+

function tilesHtml(list,cls){return '<div class="tiles '+(cls||'')+'">'+list.map(function(x){return '<div class="tile"><div class="ti">'+x[0]+'</div><b>'+esc(x[1])+'</b>'+(x[2]?'<span>'+esc(x[2])+'</span>':'')+'</div>';}).join('')+'</div>';}
function chipsHtml(list){return '<div class="schips">'+list.map(function(c){return '<span class="delta">'+esc(c)+'</span>';}).join('')+'</div>';}
function slideBody(sl){
  var h='';
  if(sl.kind==='hero'||sl.kind==='close'){h=artHtml(sl.art,null,null)+'<h1 class="neon">'+esc(sl.t)+'</h1>'+(sl.lead?'<p class="slead">'+esc(sl.lead)+'</p>':'')+(sl.quote?'<p class="quote">'+esc(sl.quote)+'</p>':'')+(sl.chips?chipsHtml(sl.chips):'');}
  else if(sl.kind==='triangle'){h='<h1 class="neon">'+esc(sl.t)+'</h1><div class="cols2"><div class="trifig">'+triangleSvg()+'</div><div><p class="slead">'+esc(sl.lead)+'</p></div></div>';}
  else if(sl.kind==='tiles'||sl.kind==='lessons'){h='<h1 class="neon">'+esc(sl.t)+'</h1>'+tilesHtml(sl.tiles,sl.kind==='lessons'?'five':'');}
  else if(sl.kind==='flow'){h='<h1 class="neon">'+esc(sl.t)+'</h1>'+tilesHtml(sl.flow,'flow')+chipsHtml(sl.chips);}
  else if(sl.kind==='quote'){h='<h1 class="neon">'+esc(sl.t)+'</h1><p class="quote">'+esc(sl.quote)+'</p>'+tilesHtml(sl.tiles,'six');}
  else if(sl.kind==='versus'){h='<h1 class="neon">'+esc(sl.t)+'</h1><div class="vs"><div class="vh">📘 The textbook</div><div class="vh real">🌧️ The real world</div>'+sl.rows.map(function(r){return '<div class="vc">'+esc(r[0])+'</div><div class="vc real">'+esc(r[1])+'</div>';}).join('')+'</div>';}
  else if(sl.kind==='room'){var st=roomStats(),d=st.done;
    h=artHtml(7,null,null).replace('class="art"','class="art short"')+'<h1 class="neon">'+esc(sl.t)+'</h1>';
    if(!d.length)h+='<p class="slead">Results appear here once crews finish Launch Night.</p>';
    else{var onT=d.filter(function(t){return t.result.onTime;}).length,onB=d.filter(function(t){return t.result.over<=0;}).length,avg=Math.round(d.reduce(function(a,t){return a+t.result.score;},0)/d.length);
      var groups={};d.forEach(function(t){(groups[t.result.ending]=groups[t.result.ending]||[]).push(t.name);});
      h+='<div class="tiles six"><div class="tile"><div class="ti">⏱</div><b>'+onT+' of '+d.length+'</b><span>finished on time</span></div><div class="tile"><div class="ti">💰</div><b>'+onB+' of '+d.length+'</b><span>stayed on budget</span></div><div class="tile"><div class="ti">🏅</div><b>'+avg+' / 100</b><span>average project health</span></div></div>'+
       '<div class="tiles">'+Object.keys(groups).map(function(k){var e=ENDINGS[k]||{};return '<div class="tile"><div class="ti">'+(e.sigil||'')+'</div><b>'+esc(e.title||k)+'</b><span>'+groups[k].map(esc).join(', ')+'</span></div>';}).join('')+'</div>';}}
  else if(sl.kind==='choices'){var s2=roomStats();h='<h1 class="neon">'+esc(sl.t)+'</h1>';
    if(!s2.N)h+='<p class="slead">This fills in from the crews’ decisions.</p>';
    else h+='<div class="sbars">'+s2.bars.map(function(b){var pct=Math.round(100*b[1]/s2.N);return '<div class="sbar"><span>'+esc(b[0])+'</span><div class="bar"><i style="width:'+pct+'%"></i></div><b>'+b[1]+' of '+s2.N+'</b></div>';}).join('')+'</div>';}
  if(sl.foot)h+='<p class="'+(sl.kind==='lessons'?'quote small-q':'sfoot')+'">'+esc(sl.foot)+'</p>';
  return h;
}
function curSlides(){return DECKS[APP.deck||'intro'];}
function curSlide(){var d=curSlides();APP.slide=Math.max(0,Math.min(APP.slide||0,d.length-1));return d[APP.slide];}
function renderSlides(force){
  var el=document.getElementById('h-slides');if(!el)return;var d=curSlides(),sl=curSlide();
  var live=(sl.kind==='room'||sl.kind==='choices')?JSON.stringify(roomStats().bars)+roomStats().done.length:'';
  var key=APP.deck+'|'+APP.slide+'|'+live;if(!force&&APP._slideKey===key)return;APP._slideKey=key;
  el.innerHTML='<div class="deckbar"><div class="seg viewseg" role="group" aria-label="Slide deck"><button data-act="deck" data-d="intro" aria-pressed="'+(APP.deck==='intro')+'">🎬 Opening</button><button data-act="deck" data-d="debrief" aria-pressed="'+(APP.deck==='debrief')+'">🏁 Debrief</button></div>'+
   '<span class="small muted">Slide '+(APP.slide+1)+' of '+d.length+'. Use ← → or a clicker.</span><button class="btn ghost" data-act="print-script">🖨 Print facilitator script</button></div>'+
   '<div class="slide">'+slideBody(sl)+'</div>'+
   '<div class="row" style="justify-content:space-between;margin-top:10px"><button class="btn ghost" data-act="slide-prev"'+(APP.slide===0?' disabled':'')+'>← Back</button><button class="btn" data-act="slide-next"'+(APP.slide===d.length-1?' disabled':'')+'>Next →</button></div>';
}
function openDeck(d){APP.deck=d;APP.slide=0;setView('slides');}
function slideStep(n){var d=curSlides();var i=Math.max(0,Math.min((APP.slide||0)+n,d.length-1));if(i!==APP.slide){APP.slide=i;renderSlides(true);renderHostLive(false);}}
function scriptHtml(){
  function notesList(deck){return DECKS[deck].map(function(sl){return '<li><b>'+esc(sl.t)+'</b><br>'+esc(sl.notes)+'</li>';}).join('');}
  var miss=STAGES.map(function(st,k){var opts=CHOICES[k]?CHOICES[k].map(function(c){return '<li><b>'+c.id+': '+esc(c.title)+'</b> ('+esc(TL[k][c.id])+')</li>';}).join(''):'';
    var v=(st.voices||[]).map(function(x){return '<li>'+esc(roleOf(x.r).title)+': “'+esc(x.t)+'”</li>';}).join('');
    return '<h3>'+esc(missionLabel(k))+': '+esc(st.name)+' ('+esc(st.when)+')</h3><p><b>Read aloud:</b> '+esc(st.news)+'</p>'+(v?'<p><b>Voices:</b></p><ul>'+v+'</ul>':'')+(opts?'<p><b>Options:</b></p><ul>'+opts+'</ul>':'')+
      '<p><b>Your story:</b> '+esc(st.say)+'</p><p><b>Lesson:</b> '+esc(st.lesson)+'</p><p><b>My story notes:</b> ______________________________________________</p>';}).join('');
  return '<h1>Project Liftoff: facilitator script</h1><p>60 minutes: opening 5, the Deal 7, six missions about 6 each, Launch Night 4, debrief 8.</p>'+
   '<h2>Before you start</h2><ul><li>Console open and showing ● Live, fresh session code.</li><li>Crew QR codes printed or on screen.</li><li>Phone hotspot ready as a backup.</li></ul>'+
   '<h2>Opening slides (5 min)</h2><ol>'+notesList('intro')+'</ol>'+
   '<h2>Each mission</h2><p>Briefing (Crew screen, Example crew) → Open voting → Close → your story → Reveal (poll on Console) → Next.</p>'+miss+
   '<h2>Debrief slides (8 min)</h2><ol>'+notesList('debrief')+'</ol>';
}
function printScript(){var pa=document.getElementById('print-area');if(!pa){pa=document.createElement('div');pa.id='print-area';document.body.appendChild(pa);}pa.innerHTML=scriptHtml();try{window.print();}catch(e){}}

/* ---------- Events ---------- */
document.addEventListener('click',function(ev){
  if(APP.mirror)return;
  var el=ev.target.closest('[data-act]');if(!el)return;var act=el.getAttribute('data-act');
  if(act==='modal-cancel'){closeModal();return;}
  if(act==='modal-ok'){var fn=APP.modalOk;closeModal();if(fn)fn();return;}
  if(act==='goto'){ev.preventDefault();location.hash=el.getAttribute('data-to');location.reload();return;}
  if(act==='begin'){var v=(document.getElementById('tn').value||'').trim();APP.s.name=v||('Crew '+APP.team);APP.s.phase='party';saveTeam();renderTeam();window.scrollTo(0,0);return;}
  if(act==='party-ready'){APP.s.phase='play';saveTeam();renderTeam();window.scrollTo(0,0);return;}
  if(act==='feat'){if(el.disabled||APP.dealLock)return;var id=el.getAttribute('data-id');if(fById(id).must)return;var a=APP.sel.features,i=a.indexOf(id);if(i>=0)a.splice(i,1);else a.push(id);el.setAttribute('aria-pressed',String(i<0));renderFit();return;}
  if(act==='test'){if(el.disabled||APP.dealLock)return;APP.sel.test=el.getAttribute('data-id');$app.querySelectorAll('[data-act="test"]').forEach(function(b){b.setAttribute('aria-pressed',String(b===el));});renderFit();return;}
  if(act==='seal-plan'){sealPlan();return;}
  if(act==='pick'){if(el.disabled||el.getAttribute('aria-disabled')==='true')return;APP.sel.choice=el.getAttribute('data-id');APP.sel.drop=[];var y=window.scrollY;renderTeam();window.scrollTo(0,y);return;}
  if(act==='drop'){var d=el.getAttribute('data-id'),arr=APP.sel.drop,ix=arr.indexOf(d);if(ix>=0)arr.splice(ix,1);else arr.push(d);var y2=window.scrollY;renderTeam();window.scrollTo(0,y2);return;}
  if(act==='seal-scene'){if(sealReady())sealScene();return;}
  if(act==='continue'){APP.s.phase='play';APP.s.lastOutcome=null;saveTeam();renderTeam();window.scrollTo(0,0);return;}
  if(act==='roll-launch'){rollLaunch();return;}
  if(act==='h-next'){setControl({stage:APP.control.stage+1,phase:'brief',voteStart:0});return;}
  if(act==='h-next-vote'){setControl({stage:APP.control.stage+1,phase:'vote'},true);return;}
  if(act==='h-vote'){var vs=+(document.getElementById('vs')||{value:90}).value;setControl({phase:'vote',voteSecs:vs},true);return;}
  if(act==='h-extend'){if(APP.control.voteSecs)setControl({voteSecs:APP.control.voteSecs+30});return;}
  if(act==='h-close'){setControl({phase:'closed'});return;}
  if(act==='h-reopen'){setControl({phase:'vote'},true);return;}
  if(act==='h-reveal'){var nn=teamCount(),tm=APP.hostData.teams||{},miss=0;for(var q=1;q<=nn;q++){var tq=tm['team'+q];if(tq&&!teamLocked(tq,APP.control.stage))miss++;}
    if(miss)confirmModal('Reveal now?',miss+' crew(s) didn’t lock in. The CEO decides for them.','Reveal',function(){setControl({phase:'reveal'});});else setControl({phase:'reveal'});return;}
  if(act==='view'){setView(el.getAttribute('data-v'));return;}
  if(act==='open-deck'){openDeck(el.getAttribute('data-d'));return;}
  if(act==='deck'){APP.deck=el.getAttribute('data-d');APP.slide=0;renderSlides(true);renderHostLive(false);return;}
  if(act==='slide-next'){slideStep(1);return;}
  if(act==='slide-prev'){slideStep(-1);return;}
  if(act==='print-script'){printScript();return;}
  if(act==='pv-target'){APP.pvTarget=el.getAttribute('data-t');renderPvBar();renderPvFrame(false);return;}
  if(act==='pv-size'){APP.pvSize=el.getAttribute('data-v');renderPvBar();renderPvFrame(false);return;}
  if(act==='toggle-notes'){APP.showNotes=!APP.showNotes;renderHostLive(false);return;}
  if(act==='toggle-results'){APP.showResults=!APP.showResults;renderHostLive(false);return;}
  if(act==='to-setup'){var dd=document.getElementById('setup-sec');if(dd)dd.open=true;return;}
  if(act==='show-links'){showLinks(false);return;}
  if(act==='show-qr'){showLinks(true);return;}
  if(act==='save-setup'){APP.session=sanitizeSession(document.getElementById('ss').value);APP.db=normDb(document.getElementById('dbu').value);var tcv=+document.getElementById('tc').value||6;
    LS.set('liftoff:session',APP.session);LS.set('liftoff:db',APP.db);
    testSync().then(function(ok){APP.control.teams=tcv;if(ok)dbPut('control',APP.control).catch(function(){});renderHostShell();hostPoll();});return;}
  if(act==='reset-session'){confirmModal('Reset “'+APP.session+'”?','Deletes every crew’s progress in this session. Use it after a dry run, never mid-game.','Reset',function(){
    if(!APP.sync)return;dbDel('').then(function(){mergeControl({teams:APP.control.teams});return dbPut('control',APP.control);}).then(function(){APP.hostData={};renderHostLive(true);}).catch(function(){alert('Reset failed.');});});return;}
});
document.addEventListener('input',function(ev){if(APP.mirror)return;if(ev.target.id==='nrange'){APP.sel.n=+ev.target.value;var n=document.getElementById('nval');if(n)n.textContent=APP.sel.n;renderFit();}});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&$modal.innerHTML)closeModal();
  var tg=(ev.target&&ev.target.tagName)||'';if(APP.role==='host'&&!APP.readOnly&&!/INPUT|SELECT|TEXTAREA/.test(tg)&&!ev.ctrlKey&&!ev.metaKey&&!ev.altKey&&!$modal.innerHTML){
    if(ev.key==='v'||ev.key==='V')setView(APP.view==='crew'?'console':'crew');
    else if(APP.view==='slides'&&(ev.key==='ArrowRight'||ev.key==='PageDown'||ev.key===' ')){ev.preventDefault();slideStep(1);}
    else if(APP.view==='slides'&&(ev.key==='ArrowLeft'||ev.key==='PageUp')){ev.preventDefault();slideStep(-1);}}});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&APP.role==='team'&&APP.sync)pollControl();});

/* ---------- Boot ---------- */
function controlKey(){var c=APP.control;return c.stage+'|'+c.phase+'|'+c.voteStart+'|'+c.voteSecs;}
function pollControl(){return dbGet('control').then(function(c){if(!c)return;var b=controlKey();mergeControl(c);var chg=b!==controlKey(),s=APP.s;
  if(s.phase==='outcome'&&APP.control.stage>s.stageDone){s.phase='play';s.lastOutcome=null;saveTeam();renderTeam();window.scrollTo(0,0);}
  else if(chg&&s.phase==='play')renderTeam();}).catch(function(){});}
function teamLoop(){pollControl().then(function(){setTimeout(teamLoop,APP.control.phase==='vote'?1000:2000);});}
function teamTick(){var cd=document.getElementById('cd');if(cd){var r=voteRemaining();cd.textContent=fmtSecs(r);cd.classList.toggle('hot',r<=15);if(r<=0&&APP.s.phase==='play'&&APP.mirror!=='sample')renderTeam();}}
function bootTeam(){
  APP.s=loadLocal()||newState();
  if(APP.db)$app.innerHTML='<div class="center" style="padding-top:14vh"><div class="big-emoji">📡</div><h1 class="neon">Connecting…</h1></div>';
  testSync().then(function(){if(!APP.sync)return null;
    return dbGet('teams/team'+APP.team).then(function(r){if(r&&r.state&&r.state.v===1&&(r.state.stageDone>APP.s.stageDone||(r.state.pending&&!APP.s.pending&&r.state.stageDone>=APP.s.stageDone))){APP.s=r.state;LS.set(teamKey(),JSON.stringify(APP.s));}}).catch(function(){});
  }).then(function(){renderTeam();if(APP.sync){teamLoop();setInterval(teamTick,250);setInterval(syncClock,60000);}});
}
function bootHost(){
  renderHostShell();
  testSync().then(function(ok){renderHostShell();if(ok){hostPoll();setInterval(hostPoll,1200);setInterval(syncClock,60000);}});
  setInterval(function(){var c=APP.control;if(c.phase==='vote'){var r=hostRemaining(),el=document.getElementById('h-cd');if(el){el.textContent=fmtSecs(r);el.style.color=r<=15?'var(--red)':'';}
    if(!APP.readOnly&&c.voteSecs&&r<=0&&APP.sync&&!APP.pendingWrite)setControl({phase:'closed'});}},250);
}
/* ---------- Crew screen mirror (shown inside the Game Master console) ---------- */
function sampleState(){var K=APP.control.stage,s=newState();s.name='Example crew';
  if(K<0){s.phase='party';return s;}
  if(K>=1)startPlan(s,{features:['flight','safety','ota','app','launch'],n:18,test:'standard'});
  s.stageDone=K-1;s.phase='play';return s;}
function renderMirror(){
  APP.sel=null;
  if(APP.mirror==='sample'){APP.s=sampleState();$hud.innerHTML='';var K=APP.control.stage,P=APP.control.phase;
    if(K<0)return renderRoles();
    return renderMission(K,P==='vote'?'open':'brief');}
  if(!APP.mirrorRaw){$hud.innerHTML='';$app.innerHTML=artHtml('hero','Crew '+APP.team+' hasn’t joined yet','Crew '+APP.team)+'<p class="sit center" style="margin:20px auto">Their screen appears here as soon as they scan their QR code.</p>';return;}
  APP.s=JSON.parse(APP.mirrorRaw);renderTeam();
}
function mirrorPoll(){
  return Promise.all([dbGet('control'),APP.mirror==='crew'?dbGet('teams/team'+APP.team):Promise.resolve(null)]).then(function(r){
    if(r[0])mergeControl(r[0]);APP.mirrorRaw=(r[1]&&r[1].state&&r[1].state.v===1)?JSON.stringify(r[1].state):'';
    var key=controlKey()+'#'+APP.mirrorRaw;if(key!==APP.mirrorKey){APP.mirrorKey=key;renderMirror();}}).catch(function(){});
}
function mirrorLoop(){mirrorPoll().then(function(){setTimeout(mirrorLoop,1000);});}
function bootMirror(){
  document.body.classList.add('mirror');
  $app.innerHTML='<div class="center" style="padding-top:14vh"><div class="big-emoji">📡</div><h1 class="neon">Connecting…</h1></div>';
  testSync().then(function(ok){
    if(!ok){$app.innerHTML='<div class="banner">The crew screen needs the live database. Check Setup and links on the console.</div>';return;}
    mirrorLoop();setInterval(teamTick,250);setInterval(syncClock,60000);});
}
if(APP.mirror)bootMirror();else if(APP.role==='team')bootTeam();else if(APP.role==='host')bootHost();else renderLanding();
</script>
