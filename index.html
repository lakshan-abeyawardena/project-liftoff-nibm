<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project Liftoff: Neo-Colombo 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,400;0,500;0,600;0,700;1,600&family=Monoton&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#F4EAFB; --bg2:#E8D9F5; --panel:#FFFFFF; --card:#FFFFFF; --ink:#1C1035; --muted:#5E4D7E;
  --pink:#C0137A; --cyan:#007E86; --gold:#9A6A00; --money:#1B7F3A; --red:#B3122E;
  --line:rgba(28,16,53,.14); --glow:none; --glow-c:none; --shadow:0 10px 26px rgba(40,10,80,.14);
  --btn:#C0137A; --btn-ink:#FFFFFF; --stamp:#C0137A;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#120A2A; --bg2:#1C1140; --panel:#1A1038; --card:#1E1344; --ink:#F2EAFF; --muted:#AE9DD6;
    --pink:#FF3EA5; --cyan:#2DE2E6; --gold:#FFD23F; --money:#7CFF8A; --red:#FF4D6A;
    --line:rgba(242,234,255,.13); --glow:0 0 12px rgba(255,62,165,.55); --glow-c:0 0 14px rgba(45,226,230,.5);
    --shadow:0 16px 40px rgba(0,0,0,.5); --btn:#FF3EA5; --btn-ink:#160B30; --stamp:#FF3EA5;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#120A2A; --bg2:#1C1140; --panel:#1A1038; --card:#1E1344; --ink:#F2EAFF; --muted:#AE9DD6;
  --pink:#FF3EA5; --cyan:#2DE2E6; --gold:#FFD23F; --money:#7CFF8A; --red:#FF4D6A;
  --line:rgba(242,234,255,.13); --glow:0 0 12px rgba(255,62,165,.55); --glow-c:0 0 14px rgba(45,226,230,.5);
  --shadow:0 16px 40px rgba(0,0,0,.5); --btn:#FF3EA5; --btn-ink:#160B30; --stamp:#FF3EA5;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Chakra Petch",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg2)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:18px 18px 64px}
.wrap.wide{max-width:1320px}
.neon{font-family:"Monoton","Chakra Petch",sans-serif;font-weight:400;color:var(--pink);text-shadow:var(--glow);letter-spacing:.02em;line-height:1.1;margin:0}
h1.neon{font-size:clamp(1.9rem,5.2vw,3.6rem)}
.sub{font-size:.9rem;color:var(--muted);margin:14px 0 2px}
.muted{color:var(--muted)}.small{font-size:.86rem}
.ok{color:var(--money);font-weight:700}.bad{color:var(--red);font-weight:700}
h2.h{font-size:1.15rem;font-weight:700;margin:26px 0 10px;color:var(--cyan)}

/* ---------- HUD ---------- */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg2);border-bottom:1px solid var(--line)}
.hud-in{max-width:1120px;margin:0 auto;padding:8px 18px;display:grid;grid-template-columns:1.1fr 1.1fr 1.3fr 1fr 1.3fr;gap:14px;align-items:center}
.hk{font-size:.72rem;color:var(--muted)}
.hv{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hs{font-size:.74rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hs.warn{color:var(--red);font-weight:700}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--cyan);box-shadow:var(--glow-c)}
.bar.health i{background:var(--pink);box-shadow:var(--glow)}
.money{font-size:1.45rem;font-weight:700;color:var(--money);text-align:right;line-height:1.1}
.stars{color:var(--gold);letter-spacing:.12em;text-align:right;font-size:1.05rem}
.stars .off{opacity:.25}
@media (max-width:820px){.hud-in{grid-template-columns:repeat(3,minmax(0,1fr))}.money,.stars{text-align:left}}

/* ---------- Art + comic captions ---------- */
.art{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:21/8;min-height:220px;background:#1a0b3d;box-shadow:var(--shadow);margin-top:10px}
.art svg,.art img.art-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.art::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 3px);pointer-events:none}
.caps{display:flex;gap:12px;flex-wrap:wrap;margin:-26px 14px 6px;position:relative;z-index:3}
.cap{flex:1 1 200px;background:#FFD23F;color:#14092B;border:3px solid #14092B;box-shadow:5px 5px 0 #14092B;padding:8px 12px;font-weight:700;font-size:1.02rem;line-height:1.3}
.cap.c0{transform:rotate(-1.2deg)}.cap.c1{background:#fff;transform:rotate(.8deg)}.cap.c2{transform:rotate(-.6deg)}
.badge{position:absolute;top:12px;right:14px;z-index:2;background:rgba(10,4,30,.75);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:4px 12px;font-size:.8rem}
@media (max-width:720px){.art{aspect-ratio:16/9;min-height:0}.caps{margin:10px 0}}
.ctrl{position:sticky;bottom:0;z-index:6;margin-top:18px;padding-bottom:env(safe-area-inset-bottom,0px)}
.ctrl-in{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;background:var(--bg2);border:1px solid var(--pink);box-shadow:var(--glow);border-radius:14px;padding:12px 16px}
.sel{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px;margin:0 6px}
.crew.au{border-color:var(--red)}
.hstage .art{aspect-ratio:auto;height:clamp(170px,30vh,360px);min-height:0}
.hstage h1.neon{font-size:clamp(1.8rem,4vw,3rem)}
.hstage .huge{font-size:clamp(2.6rem,7vw,5rem)}
/* ---------- News ticker ---------- */
.ticker{display:flex;align-items:stretch;background:#0A0520;color:#fff;border-radius:0 0 12px 12px;overflow:hidden;font-size:.95rem}
.ticker b{background:#E8152E;padding:8px 12px;white-space:nowrap;flex:none}
.ticker .run{overflow:hidden;flex:1;position:relative;padding:8px 0}
.ticker .run span{display:inline-block;white-space:nowrap;padding-left:100%;animation:tick 18s linear infinite}
@keyframes tick{to{transform:translateX(-100%)}}

/* ---------- Layout ---------- */
.mission{display:grid;grid-template-columns:330px minmax(0,1fr);gap:22px;align-items:start;margin-top:18px}
@media (max-width:900px){.mission{grid-template-columns:1fr}}

/* ---------- Phone (crew chat) ---------- */
.phone{background:#0E0826;color:#EDE6FF;border-radius:30px;padding:12px;border:2px solid #2A1C55;box-shadow:var(--shadow)}
.phone .top{display:flex;justify-content:space-between;font-size:.75rem;color:#9F8FD0;padding:2px 10px 8px}
.phone .title{font-weight:700;padding:0 10px 8px;border-bottom:1px solid rgba(255,255,255,.08)}
.msgs{display:grid;gap:10px;padding:10px 4px 4px}
.msg{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:start;animation:pop .35s ease both}
.msg .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#24164F;font-size:1.1rem}
.msg .nm{font-size:.74rem;color:#2DE2E6}
.msg .nm span{color:#9F8FD0}
.msg .bb{background:#24164F;border-radius:4px 14px 14px 14px;padding:7px 10px;font-size:.92rem;line-height:1.35}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- Mission cards ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.cc{position:relative;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-height:215px;transition:transform .15s ease,border-color .15s ease}
.cc:hover{transform:translateY(-3px)}
.cc[aria-pressed="true"]{border-color:var(--cyan);box-shadow:var(--glow-c),var(--shadow);transform:translateY(-5px)}
.cc[disabled]{cursor:not-allowed;opacity:.5;transform:none}
.cc.lockedv{opacity:.82;cursor:default}
.cc.lockedv:hover{transform:none}
.cc .lt{position:absolute;top:10px;right:14px;font-family:"Monoton",sans-serif;font-size:1.6rem;color:var(--pink);text-shadow:var(--glow)}
.cc .sig{font-size:2rem;line-height:1}
.cc h3{font-size:1.12rem;line-height:1.2;margin:2px 0 0;padding-right:28px}
.cc .fl{margin:0;color:var(--muted);font-size:.9rem}
.cc ul{margin:auto 0 0;padding:8px 0 0;list-style:none;border-top:1px dashed var(--line);font-size:.82rem}
.cc li{padding:1px 0}
.cc .lockr{font-size:.82rem;color:var(--red);font-weight:700}
.stamp{position:absolute;right:12px;bottom:12px;border:3px solid var(--stamp);color:var(--stamp);padding:4px 10px;border-radius:8px;font-weight:700;font-size:1.05rem;transform:rotate(-10deg);background:var(--card);box-shadow:var(--glow);animation:stamp .5s cubic-bezier(.2,1.6,.4,1) both;z-index:2}
@keyframes stamp{from{transform:scale(2.4) rotate(-25deg);opacity:0}to{transform:scale(1) rotate(-10deg);opacity:1}}

/* ---------- Status strip ---------- */
.strip{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:14px 0}
.cd{font-family:"Monoton",sans-serif;font-size:2rem;color:var(--cyan);text-shadow:var(--glow-c);min-width:3.2em}
.cd.hot{color:var(--red)}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:.8rem;font-weight:700;border:1px solid currentColor}

/* ---------- Picker ---------- */
.picker{background:var(--panel);border:1px dashed var(--pink);border-radius:12px;padding:12px;margin:12px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}

/* ---------- Buttons ---------- */
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:10px;padding:12px 20px;font-weight:700;cursor:pointer;background:var(--btn);color:var(--btn-ink);font-size:1rem;box-shadow:var(--glow)}
.btn[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.danger{background:transparent;color:var(--red);border:1px solid var(--red);box-shadow:none}
.btn.big{padding:15px 26px;font-size:1.08rem}
.btn.cyan{background:var(--cyan);box-shadow:var(--glow-c)}

/* ---------- Panels / planning ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:20px;align-items:start}
@media (max-width:880px){.grid2{grid-template-columns:1fr}}
.sticky{position:sticky;top:calc(env(safe-area-inset-top,0px) + 86px)}
.feat{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.fc{text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.fc[aria-pressed="true"]{border-color:var(--cyan);box-shadow:var(--glow-c)}
.fc[aria-pressed="false"]{opacity:.65}
.fc .top{display:flex;justify-content:space-between;gap:8px}
.fc b{font-size:.98rem}
.fc .pts{font-weight:700;white-space:nowrap;color:var(--pink)}
.fc p{margin:0;font-size:.82rem;color:var(--muted)}
.fc .meta{font-size:.76rem;color:var(--muted)}
.tag{display:inline-block;font-size:.7rem;font-weight:700;border-radius:6px;padding:1px 6px;background:var(--pink);color:var(--btn-ink)}
.tests{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:600px){.tests{grid-template-columns:1fr}}
.range{width:100%;accent-color:var(--pink)}
.bign{font-family:"Monoton",sans-serif;font-size:2.8rem;line-height:1;color:var(--cyan);text-shadow:var(--glow-c)}
.fl-row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.fl-row:last-child{border-bottom:0}
fieldset[disabled] .fc,fieldset[disabled] .range{pointer-events:none}
fieldset{border:0;margin:0;padding:0;min-width:0}

/* ---------- Dice ---------- */
.dice{display:flex;gap:18px;align-items:center;margin:16px 0}
.d20{width:92px;height:92px;flex:none;position:relative}
.d20 svg{width:100%;height:100%}
.d20 .n{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:2rem;color:#fff}
.d20.rolling svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Outcome / ending ---------- */
.banner-x{font-family:"Monoton",sans-serif;font-size:clamp(1.6rem,4.6vw,3rem);color:var(--gold);text-shadow:0 0 14px rgba(255,210,63,.45);margin:18px 0 6px;line-height:1.1}
.story{font-size:1.12rem;max-width:66ch}
.report{display:grid;gap:8px;margin:12px 0}
.rep{border-left:4px solid var(--cyan);padding:8px 12px;background:var(--panel);border-radius:0 10px 10px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}
.st{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;animation:pop .5s ease both}
.st .k{font-size:.8rem;color:var(--muted)}
.st .v{font-size:1.4rem;font-weight:700}
.log{list-style:none;padding:0;margin:0}
.log li{padding:8px 0;border-bottom:1px solid var(--line)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--panel);border:1px solid var(--line);padding:6px 10px;border-radius:8px;display:inline-block;font-size:.85rem}
.center{text-align:center}
.big-emoji{font-size:4rem;line-height:1}

/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;background:rgba(6,2,20,.7);display:grid;place-items:center;z-index:20;padding:20px}
.modal .box{background:var(--panel);color:var(--ink);border:2px solid var(--pink);box-shadow:var(--glow),0 20px 60px rgba(0,0,0,.5);border-radius:16px;max-width:460px;width:100%;padding:22px}
.modal h3{margin:0 0 8px;font-size:1.4rem}

.banner{background:rgba(255,210,63,.12);border:1px solid var(--gold);border-radius:10px;padding:10px 14px;font-size:.9rem;margin:12px 0}

/* ---------- Host ---------- */
.board{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table.tb{border-collapse:collapse;width:100%;min-width:720px;font-size:.88rem}
.tb th,.tb td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tb th{background:var(--bg2);font-weight:700}
.tb tr.cur td{background:rgba(45,226,230,.09)}
.c-lock{color:var(--money);font-weight:700}.c-wait{color:var(--gold)}.c-none{color:var(--muted)}
.count{font-family:"Monoton",sans-serif;font-size:2.4rem;line-height:1;color:var(--cyan);text-shadow:var(--glow-c)}
.read{font-size:1.25rem;line-height:1.35;margin:6px 0 10px;font-weight:600}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.steps span{padding:4px 10px;border-radius:999px;border:1px solid var(--line);font-size:.8rem;color:var(--muted)}
.steps span.on{border-color:var(--pink);color:var(--pink);font-weight:700;box-shadow:var(--glow)}
.qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.qr{background:#fff;color:#111;border-radius:12px;padding:14px;text-align:center}
.qr .q{display:grid;place-items:center;min-height:200px}
.qr a{color:#333;word-break:break-all;font-size:.7rem}
.field{display:grid;gap:4px;margin-bottom:12px}
.field input,.field select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}

/* ---------- Big screen ---------- */
.screen{min-height:100vh;display:flex;flex-direction:column;padding:18px 26px}
.screen .art{aspect-ratio:auto;height:44vh}
.crews{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:16px}
.crew{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px 14px;min-height:90px}
.crew.lk{border-color:var(--money)}
.crew .cn{font-weight:700;font-size:1.05rem}
.crew .cs{font-size:.95rem;margin-top:4px}
.huge{font-family:"Monoton",sans-serif;font-size:clamp(3rem,10vw,7rem);color:var(--cyan);text-shadow:var(--glow-c);line-height:1}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.ticker .run span{padding-left:0}}
</style>
</head>
<body>
<div id="hud"></div>
<main id="app" class="wrap"></main>
<div id="modal"></div>
<script>
/* ======================= ENGINE START ======================= */
var BUDGET = 12, RATE = 0.1;
var PERIODS = ['Jan–Feb 2027','Mar–Apr 2027','May–Jun 2027','Jul–Aug 2027','Sep–Oct 2027','Nov–Dec 2027'];
var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

var FEATURES = [
  {id:'flight', name:'Flight control system', pts:30, val:0, risk:'High', must:true, sigil:'🛩️', desc:'Keeps the Skyline stable in the air. No flight control, no flying car.'},
  {id:'safety', name:'Safety and emergency landing', pts:20, val:0, risk:'Medium', must:true, sigil:'🪂', desc:'Brings the car down safely when something fails. No certification without it.'},
  {id:'ota', name:'Over-the-air updates and security', pts:12, val:2, risk:'Medium', sigil:'📡', desc:'Patch every car remotely and keep attackers out. Unglamorous. Possibly vital.'},
  {id:'autopilot', name:'Autopilot and auto-hover', pts:28, val:5, risk:'High', sigil:'🧭', desc:'The headline feature from the demo video. Buyers expect it.'},
  {id:'app', name:'Owner mobile app', pts:14, val:4, risk:'Low', sigil:'📱', desc:'Summon, unlock and run pre-flight checks from a phone.'},
  {id:'nav', name:'3D airspace navigation', pts:16, val:3, risk:'Medium', sigil:'🗺️', desc:'Routes, no-fly zones and air traffic, in three dimensions.'},
  {id:'voice', name:'Voice assistant', pts:10, val:2, risk:'Medium', sigil:'🎙️', desc:'“Skyline, take me home.”'},
  {id:'telemetry', name:'Fleet telemetry and BI dashboard', pts:10, val:2, risk:'Low', sigil:'📊', desc:'Every car reports back, so the company sees what’s really happening.'},
  {id:'launch', name:'Launch-mode thruster controls', pts:8, val:4, risk:'Low', sigil:'🚀', desc:'Zero to 100 in under a second. Pure hype, and buyers love it.'},
  {id:'social', name:'Flight recording and sharing', pts:6, val:1, risk:'Low', sigil:'🎬', desc:'Record the flight, post it, go viral.'}
];
var HOVER = {id:'hover', name:'60-second hover mode', pts:12, val:4, risk:'High', sigil:'🌀', desc:'The CEO’s new idea, added mid-project.'};
var ALLF = FEATURES.concat([HOVER]);
var VALUE_MAX = ALLF.reduce(function(a,f){return a+f.val;},0);
var CORE_PTS = 50;

var TEST = {
  minimal:{f:1.0, q0:55, dq:-6, ds:-3, label:'Minimal', sigil:'⚡', desc:'Test only what breaks. Fastest on paper.'},
  standard:{f:0.85, q0:68, dq:-1, ds:0, label:'Standard', sigil:'⚖️', desc:'Unit and integration tests on every feature.'},
  thorough:{f:0.7, q0:82, dq:2, ds:2, label:'Thorough', sigil:'🛡️', desc:'Automated suites, security reviews, flight simulations.'}
};

function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function fById(id){for(var i=0;i<ALLF.length;i++){if(ALLF[i].id===id)return ALLF[i];}return null;}
function scopePts(ids){return ids.reduce(function(a,id){var f=fById(id);return a+(f?f.pts:0);},0);}
function sizeFactor(n){return n<=16?1:Math.max(0.6,1-(n-16)*0.015);}
function moraleFactor(M){return M>=60?1:(M>=40?0.9:0.75);}
function baseCap(s){return s.n*sizeFactor(s.n)*TEST[s.test].f*moraleFactor(s.M);}
function has(s,id){return s.features.indexOf(id)>=0;}
function optionalIn(s){return s.features.filter(function(id){var f=fById(id);return f&&!f.must&&id!=='hover';});}

function hashStr(str){var h=2166136261;for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}

function newState(){

function startPlan(s,plan){

function deadlineMonths(s){return s.deadline===5?10:12;}
function forecast(s){
  var cap=baseCap(s)||0.0001, rem=Math.max(0,s.S-s.done), need=rem/cap;
  var finishM=Math.ceil((s.period+need)*2-1e-9);
  return {cap:cap,need:need,finishM:finishM,late:s.phased?finishM>12:finishM>deadlineMonths(s),

}
function monthLabel(m){if(m<=0)return 'Jan 2027';var i=(m-1)%12,y=2027+Math.floor((m-1)/12);return MONTHS[i]+' '+y;}

function runPeriod(s){
  var p=s.period+1, cap=0, idle=s.done>=s.S;
  if(!idle){
    if(s.mod.newbies){var vet=s.n-s.mod.newbies;cap=vet*sizeFactor(s.n)*TEST[s.test].f*moraleFactor(s.M)*0.85;}
    else cap=baseCap(s);
    cap=Math.max(0,cap*s.mod.mult+s.mod.delta);
    s.done=Math.min(s.S,s.done+cap);
    s.spent+=s.n*RATE;
    s.Q+=TEST[s.test].dq; s.Sec+=TEST[s.test].ds;
  }
  s.period=p; s.doneAt[p]=s.done; s.mod={delta:0,mult:1,newbies:0};
  var fc=forecast(s);
  if(!idle&&fc.late){s.M-=3;}

  return {period:p,label:PERIODS[p-1],cap:cap,done:s.done,S:s.S,idle:idle,late:fc.late,finish:monthLabel(fc.finishM)};
}

function applyChoice(s,stage,choice,ctx){
  var text=choice.apply(s,ctx);
  s.Q=clamp(s.Q,0,100);s.Sec=clamp(s.Sec,0,100);s.M=clamp(s.M,0,100);
  var reports=[];
  if(stage>=1&&stage<=4){reports.push(runPeriod(s));}
  if(stage===6){reports.push(runPeriod(s));if(s.deadline===6||s.phased){reports.push(runPeriod(s));}}
  return {text:text,reports:reports,roll:ctx.roll||null};
}

function computeOutcome(s){
  var cap=baseCap(s)||0.0001, monthsLate=0, extra=0;
  if(s.done<s.S){var per=(s.S-s.done)/cap;monthsLate=Math.max(1,Math.ceil(per*2-1e-9));extra=s.n*RATE*per;}
  if(s.phased){var d5=s.doneAt[5]||0;if(d5<CORE_PTS){monthsLate=Math.max(monthsLate,Math.max(1,Math.ceil((CORE_PTS-d5)/cap*2-1e-9)));}}
  var cost=s.spent+extra, over=(cost-s.budget)/s.budget*100;
  var value=s.features.reduce(function(a,id){var f=fById(id);return a+(f?f.val:0);},0);
  return {onTime:monthsLate===0,monthsLate:monthsLate,cost:cost,budget:s.budget,over:over,value:value,valueMax:VALUE_MAX,
    Q:Math.round(s.Q),Sec:Math.round(s.Sec),M:Math.round(s.M)};
}

}

function pickEnding(s,o,roll){
  if(o.M<30)return 'death';
  if(!roll.ok&&o.Q>=60&&o.Sec>=60)return 'stumble';
  if(!roll.ok&&o.onTime)return 'fire';
  if(!roll.ok)return 'crash';
  if(o.over>20)return 'blowout';
  if(!o.onTime)return 'late';
  if(s.phased)return 'phased';

  return Math.round(clamp(sc,0,100));

var LS={get:function(k){try{return localStorage.getItem(k);}catch(e){return null;}},set:function(k,v){try{localStorage.setItem(k,v);}catch(e){}}};
function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function sanitizeSession(x){return String(x||'').toLowerCase().replace(/[^a-z0-9-]/g,'').slice(0,32)||'liftoff';}
function normDb(x){x=String(x||'').trim();if(!/^https?:\/\//.test(x))return '';return x.replace(/\/+$/,'');}
function money(x){return '$'+(Math.round(x*10)/10).toFixed(1)+'M';}
function reduceMotion(){return !!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);}
function missionLabel(k){return k===7?'Final mission':'Mission '+ROMAN[k];}

  s:null,sel:null,hostData:{},showChoices:false,showResults:false,voteSeen:null,tick:null};

(function(){

})();

/* ---------- Sync: Firebase Realtime Database REST ---------- */
function dbUrl(p){return APP.db+'/sessions/'+APP.session+(p?'/'+p:'')+'.json';}
function dbGet(p){return fetch(dbUrl(p),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();});}
function dbPut(p,v){return fetch(dbUrl(p),{method:'PUT',body:JSON.stringify(v)}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();});}
function dbDel(p){return fetch(dbUrl(p),{method:'DELETE'}).then(function(r){if(!r.ok)throw new Error(r.status);});}
function mergeControl(c){APP.control=Object.assign({stage:-1,phase:'brief',voteSecs:90,voteAt:0,teams:6},c||{});}
function testSync(){
  if(!APP.db){APP.sync=false;APP.syncMsg='off';return Promise.resolve(false);}
  return dbGet('control').then(function(c){APP.sync=true;APP.syncMsg='on';if(c)mergeControl(c);return true;})
    .catch(function(){APP.sync=false;APP.syncMsg='fail';return false;});
}

    if(x>280&&x<380){x+=w;continue;}

    for(var wy=330-h+10;wy<320;wy+=14){for(var wx=x+6;wx<x+w-10;wx+=10){var q=r();if(q<0.28)b+='<rect x="'+wx+'" y="'+wy+'" width="4" height="6" fill="'+(q<0.1?'#ff3ea5':q<0.2?'#2de2e6':'#ffd23f')+'" opacity=".75"/>';}}

  var svg='<svg viewBox="0 0 1200 400" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'+
   '<defs><linearGradient id="sky'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+p.a+'"/><stop offset=".62" stop-color="'+p.b+'"/><stop offset=".83" stop-color="'+p.c+'"/></linearGradient>'+

   b+

   '<rect x="0" y="330" width="1200" height="70" fill="#0c0520"/>'+grid+
   '<g fill="#07020f"><path d="M60 400 C70 330 74 300 80 262 C60 250 40 254 22 262 C42 246 64 244 80 250 C70 232 52 222 34 222 C58 214 76 226 86 242 C90 222 104 208 122 204 C108 218 98 232 94 250 C112 242 134 244 150 256 C128 252 108 254 94 264 C90 300 88 340 84 400 Z"/>'+

   '<g transform="translate(905 120)" filter="url(#gl'+id+')"><ellipse cx="60" cy="42" rx="56" ry="7" fill="'+p.c+'" opacity=".55"/>'+

function imgTag(key){var n=key==='hero'?'hero':'ch'+key;return '<img class="art-img" alt="" src="'+IMG_DIR+n+'.jpg" data-alts="'+IMG_DIR+n+'.png|'+IMG_DIR+n+'.webp" onerror="artFallback(this)">';}

/* ---------- HUD ---------- */
function heat(s){var fc=forecast(s),h=1;if(fc.late&&s.done<s.S)h+=2;if(fc.costAtEnd>s.budget)h+=1;if(s.M<40)h+=1;return clamp(h,1,5);}
function moraleWord(M){return M>=75?'Fired up':M>=60?'Steady':M>=40?'Strained':M>=25?'Fraying':'Breaking';}
function qualitySignal(Q){return Q>=70?'Few bug reports':Q>=50?'Bug reports rising':'Bugs piling up';}
function renderHud(){
  var s=APP.s;
  if(APP.role!=='team'||!s||s.stageDone<0||s.phase==='end'){$hud.innerHTML='';return;}
  var fc=forecast(s),now=s.period>=6?'Year end':PERIODS[Math.min(s.period,5)];
  var dl=s.phased?'Core 1 Nov, rest 1 Jan':(s.deadline===5?'Deadline 1 Nov 2027':'Deadline 1 Jan 2028');
  var pct=s.S?Math.round(100*s.done/s.S):0,h=heat(s),stars='';for(var i=1;i<=5;i++)stars+=i<=h?'★':'<span class="off">★</span>';
  var done=s.done>=s.S;
  $hud.innerHTML='<div class="hud" role="region" aria-label="Project status"><div class="hud-in">'+
   '<div><div class="hk">'+esc(now)+'</div><div class="hv">'+(done?'Build complete':'Finish: '+monthLabel(fc.finishM))+'</div><div class="hs '+(fc.late&&!done?'warn':'')+'">'+esc(dl)+(fc.late&&!done?', late':'')+'</div></div>'+
   '<div><div class="hk">Scope built</div><div class="hv">'+Math.round(s.done)+' / '+s.S+' pts</div><div class="bar"><i style="width:'+pct+'%"></i></div></div>'+
   '<div><div class="hk">Crew of '+s.n+', morale</div><div class="hv">'+moraleWord(s.M)+'</div><div class="bar health"><i style="width:'+s.M+'%"></i></div></div>'+
   '<div><div class="hk">Quality, security</div><div class="hv" style="color:var(--pink)">? ? ?</div><div class="hs">'+esc(qualitySignal(s.Q))+'</div></div>'+
   '<div><div class="money">'+money(s.budget-s.spent)+'</div><div class="stars" title="Heat: pressure from the CEO and investors">'+stars+'</div></div>'+
  '</div></div>';
}

}
function phoneHtml(stage){
  var adv=STAGES[stage].advice;if(!adv)return '';
  var m=ROLES.map(function(r,i){return '<div class="msg" style="animation-delay:'+(i*0.25)+'s"><div class="av">'+r.sigil+'</div><div><div class="nm">'+esc(r.title)+' <span>'+esc(r.role)+'</span></div><div class="bb">'+esc(adv[r.k])+'</div></div></div>';}).join('');
  return '<div class="phone"><div class="top"><span>'+esc(STAGES[stage].when)+'</span><span>📶 🔋</span></div><div class="title">Crew chat, 6 new messages</div><div class="msgs">'+m+'</div></div>';
}
function gate(){ // returns {mode, K, P}
  if(!APP.sync)return {mode:'free'};
  return {mode:'live',K:APP.control.stage,P:APP.control.phase};
}
function voteRemaining(){
  var c=APP.control;if(!c.voteSecs)return Infinity;
  var key=c.stage+'|'+c.voteAt;
  if(!APP.voteSeen||APP.voteSeen.key!==key)APP.voteSeen={key:key,t:Date.now()};
  return Math.max(0,c.voteSecs-(Date.now()-APP.voteSeen.t)/1000);
}
function fmtSecs(x){if(x===Infinity)return '∞';x=Math.ceil(x);return Math.floor(x/60)+':'+String(x%60).padStart(2,'0');}
function renderPlay(){
  var s=APP.s,next=s.stageDone+1;
  if(next>7){s.phase='end';return renderTeam();}
  var g=gate();
  if(g.mode==='free'){
    if(s.pending){resolveStage(next,false);return;}
    return renderMissionFor(next,'open');
  }
  if(g.K<next)return waitingScreen(next);
  if(g.K>next||g.P==='reveal'){resolveStage(next,!(s.pending&&s.pending.stage===next));return;}
  if(g.P==='brief')return renderMissionFor(next,'brief');
  if(s.pending&&s.pending.stage===next)return lockedScreen(next);
  if(g.P==='closed'||voteRemaining()<=0)return timeUpScreen(next);
  return renderMissionFor(next,'open');
}
function renderMissionFor(stage,mode){if(stage===0)return renderDeal(mode);if(stage===7)return renderLaunch(mode);return renderScene(stage,mode);}
function waitingScreen(next){
  var st=STAGES[next];
  $app.innerHTML=syncBanner()+artHtml(next,null,missionLabel(next)+': loading')+
   '<div class="center" style="margin-top:26px"><p class="sub">'+missionLabel(next)+'</p><h1 class="neon">'+esc(st.name)+'</h1><p class="story" style="margin:10px auto">Stand by. The Game Master opens the next mission.</p><p class="small muted">This screen updates by itself.</p></div>';
}
function statusStrip(mode){
  if(mode==='brief')return '<div class="strip"><span class="pill" style="color:var(--gold)">Briefing</span><span>Read the scene and your crew chat aloud. <b>Voting opens when the Game Master says so.</b></span></div>';
  if(!APP.sync)return '';
  var rem=voteRemaining();
  return '<div class="strip"><span class="pill" style="color:var(--money)">Voting open</span><span class="cd'+(rem<=15?' hot':'')+'" id="cd">'+fmtSecs(rem)+'</span><span>Lock in before the clock runs out, or the CEO decides for you.</span></div>';
}
function lockedScreen(stage){
  var s=APP.s,p=s.pending,label=s.picks[String(stage)]||'Locked in',extra='';
  if(stage===7){var o=finalize(s,seed(7));extra=diceHtml(o.roll,'pd')+'<p class="story">'+esc(o.roll.text)+'</p>';}
  $app.innerHTML=syncBanner()+artHtml(stage,null,missionLabel(stage))+
   '<div class="center" style="margin-top:24px"><div class="big-emoji">🔒</div><h1 class="neon">Locked in</h1><p class="story" style="margin:10px auto"><b>'+esc(label)+'</b></p>'+extra+
   '<p class="muted">Waiting for the Game Master to reveal what happens next.</p></div>';
}
function timeUpScreen(stage){
  $app.innerHTML=syncBanner()+artHtml(stage,null,missionLabel(stage))+
   '<div class="center" style="margin-top:24px"><div class="big-emoji">⏰</div><h1 class="neon">Time’s up</h1><p class="story" style="margin:10px auto">Your crew didn’t lock in. <b>The CEO is deciding for you.</b> You’ll see what he chose at the reveal.</p></div>';
}

/* Deal (planning) */
function defaultPlan(){return {kind:'plan',features:FEATURES.filter(function(f){return f.must;}).map(function(f){return f.id;}),n:18,test:'standard'};}
function planForecast(sel){var S=scopePts(sel.features),cap=sel.n*sizeFactor(sel.n)*TEST[sel.test].f,need=S/cap,fm=Math.ceil(need*2-1e-9),cost=sel.n*RATE*need;
  return {S:S,cap:cap,fm:fm,cost:cost,late:fm>12,over:cost>BUDGET,cap6:cap*6};}
function renderDeal(mode){
  if(!APP.sel||APP.sel.kind!=='plan')APP.sel=defaultPlan();
  var sel=APP.sel,lock=mode==='brief';
  var feats=FEATURES.map(function(f){var on=sel.features.indexOf(f.id)>=0;
    return '<button class="fc" aria-pressed="'+on+'" data-act="feat" data-id="'+f.id+'"><div class="top"><b>'+f.sigil+' '+esc(f.name)+'</b><span class="pts">'+f.pts+'</span></div><p>'+esc(f.desc)+'</p><div class="meta">'+(f.must?'<span class="tag">Required</span> ':'')+'Risk '+f.risk+(f.val?', value '+'★'.repeat(f.val):'')+'</div></button>';}).join('');
  var tests=Object.keys(TEST).map(function(k){var t=TEST[k];return '<button class="fc" aria-pressed="'+(sel.test===k)+'" data-act="test" data-id="'+k+'"><div class="top"><b>'+t.sigil+' '+t.label+'</b><span class="pts">'+Math.round(t.f*100)+'% speed</span></div><p>'+esc(t.desc)+'</p></button>';}).join('');
  $app.innerHTML=syncBanner()+artHtml(0,STAGES[0].panels,missionLabel(0))+tickerHtml(STAGES[0].news)+
   '<p class="sub">December 2026</p><h1 class="neon">The Deal</h1>'+statusStrip(mode)+
   '<div class="mission"><div>'+phoneHtml(0)+'</div><div class="grid2" style="grid-template-columns:minmax(0,1fr)"><fieldset'+(lock?' disabled':'')+'>'+
    '<h2 class="h" style="margin-top:0">1. Pick your scope (points of work)</h2><div class="feat">'+feats+'</div>'+
    '<h2 class="h">2. Hire your crew</h2><div class="panel"><div class="row" style="justify-content:space-between;align-items:end"><div><div class="bign" id="nval">'+sel.n+'</div><div class="small muted">engineers at $0.1M each per two months</div></div></div>'+

/* ---------- Team actions ---------- */
function seed(stage){return APP.session+'|team'+APP.team+'|'+stage;}
function pickLabel(ch,drop,roll){return ch.id+': '+ch.title+(drop&&drop.length?' (cut '+drop.map(function(id){return fById(id).name;}).join(', ')+')':'')+(roll?' [rolled '+roll.r+', '+(roll.ok?'success':'failure')+']':'');}
function lockStage(stage,payload){
  var s=APP.s;
  if(stage===0)s.picks['0']=payload.plan.n+' engineers, '+TEST[payload.plan.test].label+' testing, '+scopePts(payload.plan.features)+' pts';
  else if(stage<7){var ch=CHOICES[stage].filter(function(c){return c.id===payload.choice;})[0];s.picks[String(stage)]=pickLabel(ch,payload.drop);}
  else s.picks['7']='Rolled for the demo';
  s.pending=Object.assign({stage:stage},payload);APP.sel=null;saveTeam();
  if(!APP.sync){resolveStage(stage,false);return;}
  renderTeam();window.scrollTo(0,0);
}
function resolveStage(stage,auto){
  var s=APP.s,p=(s.pending&&s.pending.stage===stage)?s.pending:null;s.auto=s.auto||{};
  if(stage===0){
    var plan=p?p.plan:(APP.sel&&APP.sel.kind==='plan'?APP.sel:defaultPlan());
    startPlan(s,plan);if(auto){s.M-=10;s.auto['0']=true;}
    s.picks['0']=plan.n+' engineers, '+TEST[plan.test].label+' testing, '+s.S+' pts'+(auto?' (unlocked selection used)':'');
    s.log.push({stage:'The Deal',pick:s.picks['0']+': '+plan.features.map(function(id){return fById(id).name;}).join(', ')});
    s.lastOutcome={stage:0,title:'The Deal is done',auto:auto,text:'The CEO tells the press your crew will deliver a flying car’s software by 1 January 2028. Your forecast says '+monthLabel(Math.ceil(s.S/baseCap(s)*2-1e-9))+'. Let’s see.',reports:[]};
  } else if(stage===7){
    var o=finalize(s,seed(7));s.result=o;s.picks['7']='Rolled '+o.roll.r+(o.roll.mod>=0?'+':'')+o.roll.mod+': '+(o.roll.ok?'success':'failure');
    s.log.push({stage:'Launch Night',pick:s.picks['7']});s.stageDone=7;s.pending=null;s.phase='end';saveTeam();renderTeam();window.scrollTo(0,0);return;
  } else {
    var cid=p?p.choice:BOSS_PICK[stage],ch=CHOICES[stage].filter(function(c){return c.id===cid;})[0];
    var ctx={drop:p&&p.drop?p.drop.slice():[],seed:seed(stage),roll:null};
    var res=applyChoice(s,stage,ch,ctx);
    if(auto){s.M=clamp(s.M-10,0,100);s.auto[String(stage)]=true;}
    s.picks[String(stage)]=(auto?'CEO chose ':'')+pickLabel(ch,ctx.drop,res.roll);
    s.log.push({stage:STAGES[stage].name,pick:s.picks[String(stage)]});
    s.lastOutcome={stage:stage,title:ch.title,auto:auto,text:res.text,reports:res.reports,roll:res.roll};
  }
  s.stageDone=stage;s.pending=null;s.phase='outcome';saveTeam();renderTeam();window.scrollTo(0,0);
}
function sealPlan(){
  var sel=APP.sel,f=planForecast(sel);
  confirmModal('Lock in the Deal?','<b>'+f.S+' points</b>, <b>'+sel.n+' engineers</b>, '+TEST[sel.test].label.toLowerCase()+' testing. Forecast finish '+monthLabel(f.fm)+'. This can’t be changed.','Lock it in',function(){
    lockStage(0,{plan:{features:sel.features.slice(),n:sel.n,test:sel.test}});});
}
function sealScene(){
  var sel=APP.sel,ch=CHOICES[sel.stage].filter(function(c){return c.id===sel.choice;})[0];
  confirmModal('Lock it in?','<b>'+ch.id+': '+esc(ch.title)+'</b>'+(sel.drop.length?', cutting '+esc(sel.drop.map(function(id){return fById(id).name;}).join(', ')):'')+'. This can’t be changed.','Lock it in',function(){
    var btn=$app.querySelector('.cc[aria-pressed="true"]'),stage=sel.stage,payload={choice:sel.choice,drop:sel.drop.slice()};
    if(btn&&!reduceMotion()){btn.insertAdjacentHTML('beforeend','<div class="stamp">Locked in</div>');setTimeout(function(){lockStage(stage,payload);},800);}else lockStage(stage,payload);
  });
}
function rollLaunch(){
  var s=APP.s,b=$app.querySelector('[data-act="roll-launch"]');if(b)b.disabled=true;
  var o=finalize(s,seed(7));animateDice('ld',o.roll.r);
  setTimeout(function(){lockStage(7,{});},reduceMotion()?0:1300);
}

function resultsTable(teams,n){
  var rr='',any=false;for(var q=1;q<=n;q++){var t=teams['team'+q];if(t&&t.result){any=true;var r=t.result,e=ENDINGS[r.ending]||{};
    rr+='<tr><td><b>'+esc(t.name)+'</b></td><td>'+(e.sigil||'')+' '+esc(e.title||r.ending)+'</td><td>'+(r.onTime?'<span class="ok">On time</span>':'<span class="bad">'+r.monthsLate+' mo late</span>')+'</td><td class="'+(r.over<=0?'ok':'bad')+'">'+money(r.cost)+'</td><td>'+r.value+'/'+r.valueMax+'</td><td>'+r.Q+'</td><td>'+r.Sec+'</td><td>'+r.M+'</td><td>'+esc(r.roll)+'</td><td><b>'+r.score+'</b></td></tr>';}}
  if(!any)return '<p class="muted">Results appear as crews reach the end.</p>';
  return '<div class="board"><table class="tb"><tr><th>Crew</th><th>Ending</th><th>Time</th><th>Cost</th><th>Value</th><th>Quality</th><th>Security</th><th>Morale</th><th>Demo roll</th><th>Health</th></tr>'+rr+'</table></div>';
}
function hostPoll(){if(!APP.sync)return;dbGet('').then(function(d){d=d||{};APP.hostData=d;if(d.control&&!APP.pendingWrite)mergeControl(d.control);renderHostLive(false);}).catch(function(){});}
function setControl(patch){
  mergeControl(Object.assign({},APP.control,patch));APP.pendingWrite=true;renderHostLive(false);
  return dbPut('control',APP.control).then(function(){APP.pendingWrite=false;hostPoll();}).catch(function(){APP.pendingWrite=false;alert('Couldn’t update the session. Check the connection.');});
}
function showLinks(qr){
  var base=hostBase(),n=teamCount(),out=document.getElementById('h-links'),h='';
  if(qr){h='<div class="qr-grid">';for(var i=1;i<=n;i++){var u=teamLink(i,base);h+='<div class="qr"><b>Crew '+i+'</b><div class="q" id="qr'+i+'"></div><a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(u)+'</a></div>';}h+='</div>';}
  else{h='<ul class="log">';for(var j=1;j<=n;j++){var u2=teamLink(j,base);h+='<li><b>Crew '+j+':</b> <a href="'+esc(u2)+'" target="_blank" rel="noopener" style="color:var(--cyan);word-break:break-all">'+esc(u2)+'</a></li>';}
    h+='<li><b>Optional second screen:</b> <a href="'+esc(screenLink(base))+'" target="_blank" rel="noopener" style="color:var(--cyan);word-break:break-all">'+esc(screenLink(base))+'</a></li></ul>';}
  out.innerHTML=h;
  if(qr){if(typeof QRCode==='undefined'){out.insertAdjacentHTML('afterbegin','<div class="banner">The QR library didn’t load. Use the links instead.</div>');return;}
    for(var k=1;k<=n;k++)new QRCode(document.getElementById('qr'+k),{text:teamLink(k,base),width:190,height:190,colorDark:'#14092B',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});}
}

/* ---------- Big screen ---------- */
function renderScreen(){
  $hud.innerHTML='';$app.className='screen';
  var c=APP.control,K=c.stage,P=c.phase,teams=APP.hostData.teams||{},n=teamCount();
  if(!APP.sync){$app.innerHTML=artHtml('hero',['Neo-Colombo, 2027.','One flying car. One deadline.','Your crew writes the code.'])+'<h1 class="neon" style="margin-top:20px">Project Liftoff</h1><div class="banner">Big screen needs the live database. Open it from the Game Master console’s links.</div>';return;}
  var crews='';for(var i=1;i<=n;i++){var t=teams['team'+i],lk=K>=0&&teamLocked(t,K),txt;
    if(!t)txt='<span class="c-none">Not joined</span>';
    else if(K<0)txt='<span class="ok">Ready</span>';
    else if(P==='reveal'){var pk=(t.picks||{})[String(K)];txt=t.stageDone>=K?((t.auto||{})[String(K)]?'⏰ ':'')+esc(pk||'…'):'…';}
    else txt=lk?'<span class="ok">🔒 Locked in</span>':(P==='brief'?'<span class="muted">Reading</span>':'<span class="c-wait">Deciding…</span>');
    crews+='<div class="crew'+(lk?' lk':'')+'"><div class="cn">'+esc(t?t.name:'Crew '+i)+'</div><div class="cs">'+txt+'</div></div>';}
  var st=K>=0?STAGES[K]:null,mid='';
  if(K<0)mid='<h1 class="neon" style="margin-top:18px">Project Liftoff</h1><p class="story">Scan your crew’s QR code, name your crew and pick your roles.</p>';
  else{
    var center=P==='vote'?'<div class="huge" id="s-cd">'+fmtSecs(hostRemaining())+'</div>':P==='closed'?'<div class="huge" style="color:var(--red)">Voting closed</div>':P==='reveal'?'<div class="banner-x">The crews chose…</div>':'<div class="banner-x">Briefing</div>';
    mid='<div class="row" style="justify-content:space-between;align-items:end;margin-top:14px"><div><p class="sub">'+missionLabel(K)+', '+esc(st.when)+'</p><h1 class="neon">'+esc(st.name)+'</h1></div>'+center+'</div>';
  }
  var final=(K===7&&P==='reveal')?'<h2 class="h">Final results</h2>'+resultsTable(teams,n):'';
  $app.innerHTML=artHtml(K<0?'hero':K,st?st.panels:null,null)+(st?tickerHtml(st.news):'')+mid+'<div class="crews">'+crews+'</div>'+final;
}
function screenPoll(){if(!APP.sync)return;dbGet('').then(function(d){d=d||{};var before=JSON.stringify([APP.control,APP.hostData.teams]);APP.hostData=d;if(d.control)mergeControl(d.control);
  if(JSON.stringify([APP.control,APP.hostData.teams])!==before)renderScreen();}).catch(function(){});}

/* ---------- Events ---------- */
document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]');if(!el)return;var act=el.getAttribute('data-act');
  if(act==='modal-cancel'){closeModal();return;}
  if(act==='modal-ok'){var fn=APP.modalOk;closeModal();if(fn)fn();return;}
  if(act==='goto'){ev.preventDefault();location.hash=el.getAttribute('data-to');location.reload();return;}
  if(act==='begin'){var v=(document.getElementById('tn').value||'').trim();APP.s.name=v||('Crew '+APP.team);APP.s.phase='party';saveTeam();renderTeam();window.scrollTo(0,0);return;}
  if(act==='party-ready'){APP.s.phase='play';saveTeam();renderTeam();window.scrollTo(0,0);return;}
  if(act==='feat'){if(el.closest('fieldset[disabled]'))return;var id=el.getAttribute('data-id');if(fById(id).must)return;var a=APP.sel.features,i=a.indexOf(id);if(i>=0)a.splice(i,1);else a.push(id);el.setAttribute('aria-pressed',String(i<0));renderPlanForecast();return;}
  if(act==='test'){if(el.closest('fieldset[disabled]'))return;APP.sel.test=el.getAttribute('data-id');$app.querySelectorAll('[data-act="test"]').forEach(function(b){b.setAttribute('aria-pressed',String(b===el));});renderPlanForecast();return;}
  if(act==='seal-plan'){if(!el.disabled)sealPlan();return;}
  if(act==='pick'){if(el.disabled||el.getAttribute('aria-disabled')==='true')return;APP.sel.choice=el.getAttribute('data-id');APP.sel.drop=[];var y=window.scrollY;renderTeam();window.scrollTo(0,y);return;}
  if(act==='drop'){var d=el.getAttribute('data-id'),arr=APP.sel.drop,ix=arr.indexOf(d);if(ix>=0)arr.splice(ix,1);else arr.push(d);var y2=window.scrollY;renderTeam();window.scrollTo(0,y2);return;}
  if(act==='seal-scene'){if(sealReady())sealScene();return;}
  if(act==='continue'){APP.s.phase='play';APP.s.lastOutcome=null;saveTeam();renderTeam();window.scrollTo(0,0);return;}
  if(act==='roll-launch'){rollLaunch();return;}
  // host
  if(act==='h-next'){setControl({stage:APP.control.stage+1,phase:'brief',voteAt:0});return;}
  if(act==='h-next-vote'){var vs0=APP.control.voteSecs==null?90:APP.control.voteSecs;setControl({stage:APP.control.stage+1,phase:'vote',voteSecs:vs0,voteAt:Date.now()});return;}
  if(act==='h-vote'){var vs=+(document.getElementById('vs')||{value:90}).value;setControl({phase:'vote',voteSecs:vs,voteAt:Date.now()});return;}
  if(act==='h-extend'){var c0=APP.control;if(c0.voteSecs){setControl({voteSecs:c0.voteSecs+30});}return;}
  if(act==='h-close'){setControl({phase:'closed'});return;}
  if(act==='h-reopen'){setControl({phase:'vote',voteAt:Date.now()});return;}
  if(act==='h-reveal'){var nn=teamCount(),tm=APP.hostData.teams||{},miss=0;for(var q=1;q<=nn;q++){var tq=tm['team'+q];if(tq&&!teamLocked(tq,APP.control.stage))miss++;}
    if(miss){confirmModal('Reveal now?',miss+' crew(s) haven’t locked in. The CEO will decide for them.','Reveal',function(){setControl({phase:'reveal'});});}else setControl({phase:'reveal'});return;}
  if(act==='toggle-notes'){APP.showNotes=!APP.showNotes;renderHostLive(false);return;}
  if(act==='toggle-results'){APP.showResults=!APP.showResults;renderHostLive(false);return;}
  if(act==='to-setup'){var d=document.getElementById('setup-sec');if(d)d.open=true;return;}
  if(act==='show-links'){showLinks(false);return;}
  if(act==='show-qr'){showLinks(true);return;}
  if(act==='save-setup'){APP.session=sanitizeSession(document.getElementById('ss').value);APP.db=normDb(document.getElementById('dbu').value);APP.control.teams=+document.getElementById('tc').value;
    LS.set('liftoff:session',APP.session);LS.set('liftoff:db',APP.db);
    testSync().then(function(ok){APP.control.teams=+document.getElementById('tc').value||6;if(ok)dbPut('control',APP.control).catch(function(){});renderHostShell();hostPoll();});return;}
  if(act==='reset-session'){confirmModal('Reset “'+APP.session+'”?','Deletes every crew’s progress in this session. Use it after a dry run, never mid-game.','Reset',function(){
    if(!APP.sync)return;dbDel('').then(function(){mergeControl({teams:APP.control.teams});return dbPut('control',APP.control);}).then(function(){APP.hostData={};renderHostLive();}).catch(function(){alert('Reset failed.');});});return;}
});
document.addEventListener('input',function(ev){if(ev.target.id==='nrange'){APP.sel.n=+ev.target.value;var n=document.getElementById('nval');if(n)n.textContent=APP.sel.n;renderPlanForecast();}});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&$modal.innerHTML)closeModal();});

/* ---------- Boot ---------- */
function teamTick(){
  var cd=document.getElementById('cd');
  if(cd){var r=voteRemaining();cd.textContent=fmtSecs(r);cd.classList.toggle('hot',r<=15);if(r<=0&&APP.s.phase==='play')renderTeam();}
}
function bootTeam(){
  APP.s=loadLocal()||newState();
  if(APP.db)$app.innerHTML='<div class="center" style="padding-top:14vh"><div class="big-emoji">📡</div><h1 class="neon">Connecting…</h1></div>';
  testSync().then(function(){
    if(!APP.sync)return null;
    return dbGet('teams/team'+APP.team).then(function(r){if(r&&r.state&&r.state.v===1&&(r.state.stageDone>APP.s.stageDone||(r.state.pending&&!APP.s.pending&&r.state.stageDone>=APP.s.stageDone))){APP.s=r.state;LS.set(teamKey(),JSON.stringify(APP.s));}}).catch(function(){});
  }).then(function(){
    renderTeam();
    if(APP.sync){setInterval(function(){dbGet('control').then(function(c){if(!c)return;var b=APP.control.stage+'|'+APP.control.phase+'|'+APP.control.voteAt+'|'+APP.control.voteSecs;mergeControl(c);
      var chg=b!==APP.control.stage+'|'+APP.control.phase+'|'+APP.control.voteAt+'|'+APP.control.voteSecs;
      if(APP.s.phase==='outcome'&&APP.control.stage>APP.s.stageDone){APP.s.phase='play';APP.s.lastOutcome=null;saveTeam();renderTeam();window.scrollTo(0,0);}
      else if(chg&&APP.s.phase==='play')renderTeam();}).catch(function(){});},2000);
      setInterval(teamTick,1000);}
  });
}
function bootHost(){
  renderHostShell();
  testSync().then(function(ok){renderHostShell();if(ok){hostPoll();setInterval(hostPoll,1500);}});
  setInterval(function(){var c=APP.control;if(c.phase==='vote'){var r=hostRemaining(),el=document.getElementById('h-cd');if(el){el.textContent=fmtSecs(r);el.style.color=r<=15?'var(--red)':'';}if(c.voteSecs&&r<=0&&APP.sync&&!APP.pendingWrite){setControl({phase:'closed'});}}},500);
}
function bootScreen(){
  testSync().then(function(ok){renderScreen();if(ok){screenPoll();setInterval(screenPoll,1500);}});
  setInterval(function(){var el=document.getElementById('s-cd');if(el)el.textContent=fmtSecs(hostRemaining());},1000);
}
if(APP.role==='team')bootTeam();else if(APP.role==='host')bootHost();else if(APP.role==='screen')bootScreen();else renderLanding();
</script>
</body>
